<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <title>NOVA Nozzle Analysis</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #f0f5fa;
            --bg-glow-1: #bae6fd; 
            --bg-glow-2: #d1fae5; 
            --bg-glow-3: #fef08a;
            --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.2) 100%);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-highlight: rgba(255, 255, 255, 0.9);
            --glass-shadow: 0 20px 40px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.8), inset 0 -1px 2px rgba(0, 0, 0, 0.05);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            cursor: default;
        }
        body {
            min-height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -1;
            opacity: 0.8;
            animation: float 20s infinite alternate ease-in-out;
        }
        .orb-1 { width: 65vw; height: 65vw; background: var(--bg-glow-1); top: -25vh; left: -15vw; }
        .orb-2 { width: 55vw; height: 55vw; background: var(--bg-glow-2); bottom: -20vh; right: -10vw; animation-delay: -5s; }
        .orb-3 { width: 45vw; height: 45vw; background: var(--bg-glow-3); top: 25vh; left: 25vw; animation-delay: -10s; opacity: 0.6; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, 60px) scale(1.1); }
            100% { transform: translate(-30px, 40px) scale(0.9); }
        }
        .glass-container {
            background: var(--glass-bg);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-left: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            width: 100%;
            max-width: 1500px;
            overflow: hidden;
            position: relative;
            margin-top: 1rem;
        }
        .glass-container::before {
            content: '';
            position: absolute;
            top: 0; left: -150%; width: 50%; height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: glass-sheen 12s infinite;
            pointer-events: none;
            z-index: 1;
        }
        @keyframes glass-sheen {
            0% { left: -150%; }
            15% { left: 200%; }
            100% { left: 200%; }
        }
        .app-header {
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            background: linear-gradient(180deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 100%);
            position: relative;
            z-index: 2;
        }
        .app-header h1 {
            font-size: 1.25rem; font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-main);
            text-shadow: none;
        }
        .header-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }
        .btn-glass {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            color: var(--text-main);
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.9);
            border-color: var(--primary);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1), inset 0 1px 2px rgba(255,255,255,0.8);
            transform: translateY(-2px);
        }
        .btn-glass.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.15);
            color: var(--primary);
        }
        .method-toggle { 
            display: flex; gap: 1rem; margin-bottom: 2rem; width: 100%; justify-content: center; 
        }
        .form-body { padding: 3rem; position: relative; z-index: 2; }
        .batch-control {
            display: flex; justify-content: center; align-items: center; gap: 1rem; margin-bottom: 2rem;
            background: rgba(255,255,255,0.4); padding: 1rem; border-radius: 12px; border: 1px solid rgba(0,0,0,0.05);
        }
        .analysis-block {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(0,0,0,0.05);
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .analysis-header {
            font-size: 1.1rem; font-weight: 800; color: var(--primary);
            margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 2px solid rgba(59, 130, 246, 0.2); padding-bottom: 0.5rem;
        }
        .grid-layout { 
            display: grid; 
            grid-template-columns: repeat(5, minmax(200px, 1fr)); 
            gap: 2rem; 
            align-items: start;
        }
        .section-wrapper { min-width: 0; }
        .section-project { grid-column: 1 / 2; }
        .section-shell { grid-column: 2 / 3; }
        .section-nozzle { grid-column: 3 / 5; } 
        .section-meshing { grid-column: 5 / 6; }
        .section-load { grid-column: 1 / 6; } 
        .fields-container {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .sub-col {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }
        .section-nozzle .fields-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .section-load .fields-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2rem;
        }
        .col-title {
            color: var(--text-main); font-weight: 600; font-size: 0.85rem;
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 2rem;
            display: flex; align-items: center; gap: 0.75rem; text-shadow: none;
        }
        .col-title::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, rgba(0,0,0,0.1) 0%, transparent 100%);
        }
        .form-group { transition: all 0.3s ease; position: relative; }
        .form-group.hidden { display: none !important; }
        .form-label {
            display: flex; align-items: center; gap: 0.75rem; font-size: 0.85rem; font-weight: 500;
            color: var(--text-main); margin-bottom: 0.6rem; text-shadow: none;
        }
        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            width: 22px; height: 22px; border-radius: 6px; font-size: 0.75rem; font-weight: bold;
            color: var(--primary); background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            box-shadow: none;
        }
        .glass-input, .glass-select {
            width: 100%; padding: 0.8rem 1rem; background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px; font-size: 0.9rem; color: var(--text-main); transition: all 0.3s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); cursor: text;
        }
        .glass-select option { background: #ffffff; color: var(--text-main); }
        .glass-input:focus, .glass-select:focus {
            outline: none; border-color: rgba(96, 165, 250, 0.8); background: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 0 0 4px rgba(59, 130, 246, 0.15);
        }
        .glass-input[readonly] { background: rgba(0, 0, 0, 0.05); color: #777; cursor: not-allowed; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .input-addon-group {
            display: flex; align-items: center; background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(0, 0, 0, 0.1); border-top: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 10px; transition: all 0.3s ease; overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        .input-addon-group:focus-within { border-color: rgba(96, 165, 250, 0.8); box-shadow: inset 0 2px 4px rgba(0,0,0,0.02), 0 0 0 4px rgba(59, 130, 246, 0.15); background: #ffffff; }
        .input-addon-group .glass-input { border: none; background: transparent; box-shadow: none; }
        .addon {
            padding: 0 1rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 500;
            background: rgba(0, 0, 0, 0.03); border-left: 1px solid rgba(0, 0, 0, 0.1);
            height: 100%; display: flex; align-items: center;
        }
        .action-area {
            margin-top: 3rem; padding-top: 3rem; border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
        }
        .btn-submit {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9) 0%, rgba(37, 99, 235, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4); border-top: 1px solid rgba(255, 255, 255, 0.8);
            color: white; padding: 1.2rem 4rem; border-radius: 12px; font-weight: 600; font-size: 1rem;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.3), inset 0 1px 0 rgba(255,255,255,0.4);
            letter-spacing: 1px; backdrop-filter: blur(15px); text-transform: uppercase;
        }
        .btn-submit:hover {
            transform: translateY(-4px); box-shadow: 0 15px 35px rgba(37, 99, 235, 0.4), inset 0 2px 2px rgba(255,255,255,0.5);
            background: linear-gradient(135deg, rgba(37, 99, 235, 1) 0%, rgba(29, 78, 216, 1) 100%);
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(10px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modern-box-wrapper { position: relative; width: 90%; max-width: 800px; }
        .modern-box-wrapper::before {
            content: ""; position: absolute; inset: -4px; border-radius: 28px;
            background: linear-gradient(135deg, #00C9FF 0%, #92FE9D 50%, #3b82f6 100%);
            background-size: 200% 200%; animation: gradientGlow 6s ease infinite;
            filter: blur(15px); opacity: 0.8; z-index: 0;
        }
        @keyframes gradientGlow { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .modern-box {
            position: relative; background: rgba(15, 15, 15, 0.95); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border-radius: 24px; padding: 40px; text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.15); z-index: 1;
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05); font-family: 'Plus Jakarta Sans', sans-serif;
            color: white; max-height: 80vh; overflow-y: auto;
        }
        .modern-box h2 { font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 20px; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 30px; }
        .search-bar input { flex: 1; padding: 12px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.05); color: white; font-size: 1rem; }
        .btn-modern {
            display: inline-block; padding: 12px 25px; border-radius: 12px; background: #ffffff; color: #000000;
            text-decoration: none; font-weight: 600; font-size: 1rem; transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); cursor: pointer; border: none;
        }
        .btn-modern:hover { transform: scale(1.05); box-shadow: 0 8px 25px rgba(255, 255, 255, 0.3); background: #e0e0e0; }
        .btn-modern:active { transform: scale(0.98); }
        .job-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;
        }
        .job-details { display: flex; flex-direction: column; gap: 5px; }
        .job-id { font-family: monospace; color: #92FE9D; }
        .job-status { font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }
        .status-completed { color: #10b981; }
        .status-processing { color: #f59e0b; }
        .status-pending { color: #3b82f6; }
        .status-failed { color: #ef4444; }
        .autocomplete-list {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px); border: 1px solid rgba(0, 0, 0, 0.1); border-radius: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 1000; overflow: hidden; display: none;
        }
        .autocomplete-item {
            padding: 12px 15px; cursor: pointer; color: var(--text-main); font-size: 0.9rem; font-weight: 600;
            transition: all 0.2s ease; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center;
        }
        .autocomplete-item:last-child { border-bottom: none; }
        .autocomplete-item:hover { background: rgba(59, 130, 246, 0.1); color: var(--primary); padding-left: 20px; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        @media (max-width: 1200px) {
            .grid-layout { grid-template-columns: repeat(2, 1fr); }
            .section-wrapper { grid-column: span 1 !important; }
            .section-wrapper.section-nozzle, .section-wrapper.section-load { grid-column: span 2 !important; }
            .section-wrapper.section-load .fields-container { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 768px) {
            .grid-layout { grid-template-columns: 1fr; }
            .section-wrapper.section-nozzle, .section-wrapper.section-load { grid-column: span 1 !important; }
            .section-wrapper.section-nozzle .fields-container, .section-wrapper.section-load .fields-container { grid-template-columns: 1fr; }
            .job-card { flex-direction: column; align-items: flex-start; gap: 15px; }
        }
    </style>
</head>

    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="glass-container">
        <header class="app-header">
            <h1 id="main_title">NOVA Nozzle Analysis</h1>
            <div class="header-controls">
                <button class="btn-glass" type="button" onclick="openSearchModal()">Check Job Status</button>

            <input type="hidden" name="active_analysis" id="active_analysis" value="shell">
            <div class="method-toggle">

                    <input type="text" id="searchInput" placeholder="Enter Job ID or License Key...">
                    <button class="btn-modern" onclick="searchJobs()">Search</button>
                </div>
                <div id="jobResults"></div>
            </div>
        </div>

        async function verifyLicense(licenseKey, macAddress) {
            try {
                let res = await fetch(`${GAS_URL}?action=verify&license_key=${licenseKey}&mac_address=${macAddress}`);
                let text = await res.text();
                if (text.includes('"status":"success"')) return true;
                alert("License Verification Failed: " + text);
                return false;
            } catch (e) {
                alert("Server Connection Error");
                return false;
            }
        }

        function switchAnalysis(type) {
            currentAnalysis = type;
            document.getElementById('active_analysis').value = type;
            document.getElementById('btn-shell').classList.remove('active');
            document.getElementById('btn-head').classList.remove('active');
            document.getElementById('btn-' + type).classList.add('active');
            document.getElementById('main_title').innerText = type === "shell" ? "SHELL NOZZLE ANALYSIS" : "VESSEL HEAD ANALYSIS";
            renderForm();
        }

        function parseLabelAndUnit(rawLabel) {
            const match = rawLabel.match(/(.*?)\s*\((.*?)\):?/);
            if (match) return { label: match[1].trim(), unit: match[2].trim() };
            return { label: rawLabel.replace(':', '').trim(), unit: null };
        }

        function generateFieldHTML(f, index) {
            if (!f) return '';
            const id = `${f.name}_${index}`;
            const dependsAttr = f.dependsOn ? `data-depends-on="${f.dependsOn}_${index}" data-show-if="${f.showIf.join(',')}"` : '';
            const parsed = parseLabelAndUnit(f.label);
            let html = `<div class="form-group" ${dependsAttr} style="position: relative;"><label class="form-label">${parsed.label}</label>`;
            
            if (f.type === 'select') {
                const onChange = f.isHeadTrigger ? `onchange="updateHeadSections(${index})"` : `onchange="evaluateDependencies(${index})"`;
                html += `<select class="glass-select" name="${id}" id="${id}" ${onChange}>`;
                f.options.forEach(opt => {
                    const isSelected = opt === f.value ? 'selected' : '';
                    html += `<option value="${opt}" ${isSelected}>${opt}</option>`;
                });
                html += `</select>`;
            } else {
                const isReadonly = f.readonly ? 'readonly' : '';
                const isMatName = (f.name === "MaterialName");
                const matEvents = isMatName ? `autocomplete="off" oninput="handleMaterialSearch(this, ${index})"` : '';
                
                if (parsed.unit) {
                    html += `<div class="input-addon-group"><input type="${f.type}" step="any" class="glass-input" name="${id}" id="${id}" value="${f.value}" ${isReadonly} ${matEvents}><span class="addon">${parsed.unit}</span></div>`;
                } else {
                    html += `<input type="${f.type}" step="any" class="glass-input" name="${id}" id="${id}" value="${f.value}" ${isReadonly} ${matEvents}>`;
                }
            }
            html += `</div>`;
            return html;
        }

        function mapFields(fieldsArray, index) {
            return fieldsArray.map(f => f ? generateFieldHTML(f, index) : '').join('');
        }

        function renderForm() {
            const masterGrid = document.getElementById('master-grid');
            masterGrid.innerHTML = '';
            const numAnalyses = parseInt(document.getElementById('numAnalyses').value) || 1;
            const sections = appData[currentAnalysis];

            if (!sections) {
                masterGrid.innerHTML = `<p style="text-align:center; color:#ef4444; padding:2rem;">No field definitions exist yet for "${currentAnalysis}" analysis. Add an "${currentAnalysis}" entry to appData to enable this form.</p>`;
                return;
            }

            const getSectionKey = (title) => {
                if (title.includes("Project")) return "project";
                if (title.includes("Shell Design") || title.includes("Head Design")) return "shell";
                if (title.includes("Nozzle Design")) return "nozzle";
                if (title.includes("Meshing")) return "meshing";
                if (title.includes("Load Condition")) return "load";
                return "default";
            };

            for(let i = 1; i <= numAnalyses; i++) {
                const block = document.createElement('div');
                block.className = 'analysis-block';
                block.id = `analysis-block-${i}`;
                block.innerHTML = `<div class="analysis-header">Analysis Configuration ${i}</div><div class="grid-layout" id="form-grid-${i}"></div>`;
                masterGrid.appendChild(block);
                
                const grid = document.getElementById(`form-grid-${i}`);
                
                sections.forEach(sec => {
                    const wrapper = document.createElement('div');
                    const sectionKey = getSectionKey(sec.title);
                    wrapper.className = `section-wrapper section-${sectionKey}`;
                    if (sec.condition) wrapper.setAttribute('data-condition', sec.condition);
                    
                    const titleMatch = sec.title.match(/^(\d+)\.\s*(.*)/);
                    const badgeNum = titleMatch ? titleMatch[1] : '?';
                    const cleanTitle = titleMatch ? titleMatch[2] : sec.title;

                    let html = `<div class="col-title"><span class="badge">${badgeNum}</span> ${cleanTitle}</div><div class="fields-container">`;

                    if (sectionKey === 'nozzle') {
                        html += `<div class="sub-col">` + mapFields(sec.fields.slice(0, 5), i) + `</div><div class="sub-col">` + mapFields(sec.fields.slice(5), i) + `</div>`;
                    } else if (sectionKey === 'load') {
                        html += `<div class="sub-col">` + mapFields([sec.fields[0], sec.fields[1]], i) + `</div>`;
                        html += `<div class="sub-col">` + mapFields([sec.fields[2], sec.fields[3]], i) + `</div>`; 
                        html += `<div class="sub-col">` + mapFields([sec.fields[4], sec.fields[5]], i) + `</div>`; 
                        html += `<div class="sub-col">` + mapFields([sec.fields[6]], i) + `</div><div class="sub-col"></div>`; 
                    } else {
                        html += mapFields(sec.fields, i);
                    }
                    html += `</div>`;
                    wrapper.innerHTML = html;
                    grid.appendChild(wrapper);
                });
                
                if (currentAnalysis === 'head') updateHeadSections(i);
                else evaluateDependencies(i);
            }
        }

        function updateHeadSections(index) {
            const headSelect = document.getElementById(`h_type_${index}`);
            if (!headSelect) return;
            const activeHeadType = headSelect.value;
            const block = document.getElementById(`analysis-block-${index}`);
            block.querySelectorAll('.section-wrapper[data-condition]').forEach(wrapper => {
                if (wrapper.getAttribute('data-condition') === activeHeadType) {
                    wrapper.style.display = 'block';
                    wrapper.querySelectorAll('input, select').forEach(i => i.disabled = false);
                } else {
                    wrapper.style.display = 'none'; 
                    wrapper.querySelectorAll('input, select').forEach(i => i.disabled = true);
                }
            });
            evaluateDependencies(index);
        }

        function evaluateDependencies(index) {
            const block = document.getElementById(`analysis-block-${index}`);
            block.querySelectorAll('.form-group[data-depends-on]').forEach(group => {
                const targetName = group.getAttribute('data-depends-on');
                const showConditions = group.getAttribute('data-show-if').split(',');
                let masterInput = document.getElementById(targetName);
                if (masterInput && !masterInput.disabled && showConditions.includes(masterInput.value)) {
                    group.classList.remove('hidden');
                    group.querySelectorAll('input, select').forEach(i => i.disabled = false);
                } else {
                    group.classList.add('hidden');
                    group.querySelectorAll('input, select').forEach(i => {
                        i.disabled = true;
                        i.value = "";
                    });
                }
            });
        }

        fetch('/material.json').then(res => res.json()).then(data => { materialNamesList = data.map(mat => mat.Name); }).catch(e => {});

        function handleMaterialSearch(inputElem, index) {
            let formGroup = inputElem.closest('.form-group');
            let suggestionBox = formGroup.querySelector('.autocomplete-list');
            if (!suggestionBox) {
                suggestionBox = document.createElement('div');
                suggestionBox.className = 'autocomplete-list';
                formGroup.appendChild(suggestionBox);
            }
            const query = inputElem.value.toLowerCase().replace(/[\s\-_]/g, "");
            if (!query) { suggestionBox.style.display = 'none'; return; }
            const matches = materialNamesList.filter(name => name.toLowerCase().replace(/[\s\-_]/g, "").includes(query)).slice(0, 2); 
            if (matches.length > 0) {
                suggestionBox.innerHTML = matches.map(match => `<div class="autocomplete-item" onclick="selectMaterial('${match}', '${inputElem.id}', ${index})"><span style="font-size:14px; margin-right:8px; opacity:0.6;">⚡</span> ${match}</div>`).join('');
                suggestionBox.style.display = 'block';
            } else {
                suggestionBox.style.display = 'none';
            }
            evaluateDependencies(index);
        }

        function selectMaterial(name, inputId, index) {
            const inputElem = document.getElementById(inputId);
            if (inputElem) {
                inputElem.value = name;
                const suggestionBox = inputElem.closest('.form-group').querySelector('.autocomplete-list');
                if (suggestionBox) suggestionBox.style.display = 'none';
                evaluateDependencies(index);
            }
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.form-group')) {
                document.querySelectorAll('.autocomplete-list').forEach(box => box.style.display = 'none');
            }
        });

        async function submitBatch() {
            let licenseKey = localStorage.getItem("NOVA_LicenseKey");
            if (!licenseKey) {
                licenseKey = prompt("Please enter your registered License Key:");
                if (!licenseKey) return;
                localStorage.setItem("NOVA_LicenseKey", licenseKey);
            }
            let macAddress = getDeviceId();
            
            const btn = document.querySelector('.btn-submit');
            btn.innerText = "Verifying License...";
            btn.disabled = true;

            let isLicensed = await verifyLicense(licenseKey, macAddress);
            if (!isLicensed) {
                localStorage.removeItem("NOVA_LicenseKey");
                btn.innerText = "Submit Analysis to Cloud";
                btn.disabled = false;
                return;
            }

            btn.innerText = "Building Payload...";
            let numAnalyses = parseInt(document.getElementById('numAnalyses').value) || 1;
            let payloadArr = [];

            for(let i=1; i<=numAnalyses; i++) {
                let analysisData = { AnalysisID: i, AnalysisType: currentAnalysis };
                let block = document.getElementById(`analysis-block-${i}`);
                let inputs = block.querySelectorAll('input:not([disabled]), select:not([disabled])');
                inputs.forEach(inp => {
                    let key = inp.name.replace(`_${i}`, '');
                    let val = inp.value;
                    if(inp.type === 'number') val = parseFloat(val) || 0;
                    analysisData[key] = val;
                });
                payloadArr.push(analysisData);
            }

            btn.innerText = "Uploading to Cloud...";
            try {
                let res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`,
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        json_payload: payloadArr,
                        status: "pending",
                        license_key: licenseKey,
                        mac_address: macAddress
                    })
                });
                if(res.ok) {
                    let data = await res.json();
                    alert("Simulation successfully submitted!\nJob ID: " + data[0].id + "\nUse the Check Status button to track progress.");
                } else {
                    alert("Cloud Submission Failed.");
                }
            } catch(e) {
                alert("Network Error during submission.");
            }
            btn.innerText = "Submit Analysis to Cloud";
            btn.disabled = false;
        }

        function openSearchModal() {
            document.getElementById('searchModal').classList.add('active');
            let savedKey = localStorage.getItem("NOVA_LicenseKey");
            if(savedKey) document.getElementById('searchInput').value = savedKey;
        }

        function closeSearchModal() {
            document.getElementById('searchModal').classList.remove('active');
            document.getElementById('jobResults').innerHTML = '';
        }

        async function searchJobs() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsDiv = document.getElementById('jobResults');
            if(!query) {
                resultsDiv.innerHTML = '<p style="color:#ef4444;">Please enter a valid Job ID or License Key.</p>';
                return;
            }
            resultsDiv.innerHTML = '<p>Searching cloud repository...</p>';
            try {
                let url = `${API_URL}?select=id,status,result_url,created_at&or=(id.eq.${query},license_key.eq.${query})&order=created_at.desc`;
                let res = await fetch(url, {
                    method: "GET",
                    headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
                });
                if(res.ok) {
                    let data = await res.json();
                    if(data.length === 0) {
                        resultsDiv.innerHTML = '<p style="color:#f59e0b;">No jobs found for this ID/Key.</p>';
                        return;
                    }
                    let html = '';
                    data.forEach(job => {
                        let dateStr = new Date(job.created_at).toLocaleString();
                        html += `<div class="job-card">
                                    <div class="job-details">
                                        <span class="job-id">ID: ${job.id}</span>
                                        <span style="font-size:0.8rem; color:#a0a0a0;">Submitted: ${dateStr}</span>
                                        <span class="job-status status-${job.status}">Status: ${job.status}</span>
                                    </div>`;
                        if(job.status === 'completed' && job.result_url) {
                            html += `<a href="${job.result_url}" target="_blank" class="btn-modern" style="padding: 8px 15px; font-size:0.9rem;">Download Results</a>`;
                        }
                        html += `</div>`;
                    });
                    resultsDiv.innerHTML = html;
                } else {
                    resultsDiv.innerHTML = '<p style="color:#ef4444;">Error retrieving jobs.</p>';
                }
            } catch(e) {
                resultsDiv.innerHTML = '<p style="color:#ef4444;">Connection error.</p>';
            }
        }

        window.onload = renderForm;
    </script>
</body>
</html>
