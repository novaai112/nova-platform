        .autocomplete-dropdown {
            position: absolute;

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }

        .modal-content {

            padding: 20px; border-radius: 4px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;
        }
        .modal-header h2 { margin: 0; font-size: 18px; color: #800080; }
        .close-btn { background: none; border: none; font-size: 24px; cursor: pointer; font-weight: bold; }
        .material-table { width: 100%; border-collapse: collapse; }
        .material-table th, .material-table td { border: 1px solid #000; padding: 8px; text-align: center; }
        .material-table th { background: #bbf7d0; }
        .search-bar { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #000; box-sizing: border-box; }

        <div class="status-box">

            <input type="text" id="jobIdDisplay" class="status-input" placeholder="Job ID will appear here..." readonly>

    </div>

    <div class="modal-overlay" id="materialModal">
        <div class="modal-content">

    // --- DEVICE ID GENERATOR (MAC ADDRESS REPLACEMENT) ---
    function getDeviceId() {
        let id = localStorage.getItem('NOVA_Device_ID');
        if (!id) {
            id = crypto.randomUUID().replace(/-/g, '');
            localStorage.setItem('NOVA_Device_ID', id);
        }
        return id;
    }

    // --- RENDER EXCEL-LIKE GRID ---
    function renderGrid() {
        let cols = parseInt(document.getElementById('numAnalyses').value) || 1;
        let html = '';
        
        layoutParams.forEach(section => {
            html += `<div class="section-header">${section.section}</div>`;
            section.fields.forEach(field => {
                html += `<div class="data-row"><div class="cell-label">${field.label}</div>`;
                for (let c = 1; c <= cols; c++) {
                    let cellId = `${field.id}_${c}`;
                    html += `<div class="cell-input-wrapper">`;
                    if (field.type === 'select') {
                        html += `<select id="${cellId}" class="cell-input" onchange="runLogic(${c})">`;
                        field.options.forEach(opt => {
                            let sel = (field.def === opt) ? 'selected' : '';
                            html += `<option value="${opt}" ${sel}>${opt}</option>`;
                        });
                        html += `</select>`;
                    } else {
                        let val = field.def ? field.def : "";
                        let evts = field.hasAutocomplete 
                            ? `autocomplete="off" oninput="liveMaterialSearch(this, ${c})" onchange="runLogic(${c})"` 
                            : `onchange="runLogic(${c})"`;
                            
                        html += `<input type="${field.type}" id="${cellId}" class="cell-input" value="${val}" ${evts}>`;
                        if (field.hasAutocomplete) {
                            html += `<div id="dd_${cellId}" class="autocomplete-dropdown"></div>`;
                        }
                    }
                    html += `</div>`;
                }
                html += `</div>`;
            });
        });
        document.getElementById('mainGrid').innerHTML = html;
        for (let c = 1; c <= cols; c++) runLogic(c);
    }

    // --- LIVE MATERIAL AUTOCOMPLETE ---
    async function liveMaterialSearch(inputElem, col) {
        let dropdown = document.getElementById(`dd_${inputElem.id}`);
        let q = inputElem.value.trim();
        if (!q) { dropdown.style.display = 'none'; return; }
        
        const { data, error } = await supabase.from('materials').select('name').ilike('name', `%${q}%`).limit(5);
        if (error || !data || data.length === 0) { 
            // Always show "other material" as an option if no matches
            dropdown.innerHTML = `<div class="autocomplete-item" onclick="selectMat('other material', '${inputElem.id}', ${col})">other material</div>`;
            dropdown.style.display = 'block';
            return; 
        }
        
        let html = data.map(m => `<div class="autocomplete-item" onclick="selectMat('${m.name}', '${inputElem.id}', ${col})">${m.name}</div>`).join('');
        // Ensure 'other material' is always an accessible choice
        if(q.toLowerCase().includes("oth")) {
            html += `<div class="autocomplete-item" onclick="selectMat('other material', '${inputElem.id}', ${col})">other material</div>`;
        }
        dropdown.innerHTML = html;
        dropdown.style.display = 'block';
    }

    function selectMat(val, id, col) {
        document.getElementById(id).value = val;
        document.getElementById(`dd_${id}`).style.display = 'none';
        runLogic(col);
    }

    document.addEventListener('click', e => {
        document.querySelectorAll('.autocomplete-dropdown').forEach(d => { if(!d.contains(e.target)) d.style.display = 'none'; });
    });

    // --- EXCEL VBA LOGIC REPLICATION ---
    function runLogic(col) {
        let typeObj = document.getElementById(`TypeOfAnalysis_${col}`);
        let matObj = document.getElementById(`MaterialName_${col}`);
        let padObj = document.getElementById(`Pad_${col}`);
        
        if(!typeObj || !matObj || !padObj) return;
        
        let analysisType = typeObj.value;
        let material = matObj.value.toUpperCase();
        let padVal = padObj.value.toUpperCase();

        const toggleField = (id, enable) => {
            let el = document.getElementById(`${id}_${col}`);
            if(el) {
                el.disabled = !enable;
                if (!enable) el.value = ""; // Replicates ClearContents
            }
        }

        // Pad Logic (Row 33)
        if (padVal === "NO") {
            toggleField('PadWidth', false);
            toggleField('PadTHK', false);
        } else {
            toggleField('PadWidth', true);
            toggleField('PadTHK', true);
        }

        // Allowable Stress Logic (Row 9 & 55)
        if (analysisType === "Elastic Analysis") {
            toggleField('AllowableStress', true);
        } else {
            toggleField('AllowableStress', false);
        }

        // Material Logic (Rows 10 - 15)
        if (material !== "OTHER MATERIAL") {
            toggleField('OtherMaterialName', false);
            toggleField('YoungsModulus', false);
            toggleField('PoissonsRatio', false);
            toggleField('YieldStress', false);
            toggleField('UltimateTensileStrength', false);
        } else {
            toggleField('OtherMaterialName', true);
            toggleField('YoungsModulus', true);
            toggleField('PoissonsRatio', true);

            if (analysisType !== "Elastic Analysis") {
                toggleField('YieldStress', true);
            } else {
                toggleField('YieldStress', false);
            }

            if (analysisType !== "Elastic Analysis" && analysisType !== "Limit-Load Analysis") {
                toggleField('UltimateTensileStrength', true);
            } else {
                toggleField('UltimateTensileStrength', false);
            }
        }
    }

    // --- MATERIAL DATABASE MODAL ---
    let allMaterialsCache = [];
    
    function openMaterialModal() {
        document.getElementById('materialModal').classList.add('active');
        fetchMaterialDatabase();
    }

    function closeMaterialModal() {
        document.getElementById('materialModal').classList.remove('active');
    }

    async function fetchMaterialDatabase() {
        const tbody = document.getElementById('materialTableBody');
        const { data, error } = await supabase.from('materials').select('id, name').order('id', { ascending: true });
        
        if (error) {
            tbody.innerHTML = `<tr><td colspan="2" style="color:red;">Error loading materials.</td></tr>`;
            return;
        }
        allMaterialsCache = data;
        renderMaterialTable(allMaterialsCache);
    }

    function renderMaterialTable(dataArray) {
        const tbody = document.getElementById('materialTableBody');
        if(dataArray.length === 0) {
            tbody.innerHTML = `<tr><td colspan="2">No materials found.</td></tr>`;
            return;
        }
        tbody.innerHTML = dataArray.map(mat => `<tr><td>${mat.id}</td><td>${mat.name}</td></tr>`).join('');
    }

    function searchMaterialDatabase() {
        const q = document.getElementById('matSearchInput').value.toLowerCase();
        const filtered = allMaterialsCache.filter(m => m.name.toLowerCase().includes(q));
        renderMaterialTable(filtered);
    }

    // --- LICENSE VERIFICATION ---
    async function verifyLicense(licenseKey, macAddress) {
        try {
            let res = await fetch(`${GAS_URL}?action=verify&license_key=${licenseKey}&mac_address=${macAddress}`);
            let text = await res.text();
            if (text.includes('"status":"success"')) return true;
            alert("License Verification Failed: " + text);
            return false;
        } catch (e) {
            alert("Server Connection Error while verifying license.");
            return false;
        }
    }

                MT: parseFloat(document.getElementById(`MT_${c}`).value) || 0,
                ML: parseFloat(document.getElementById(`ML_${c}`).value) || 0,
                GlobalBodySizing: parseFloat(document.getElementById(`GlobalBodySizing_${c}`).value) || 0,
                MeshMethod: document.getElementById(`MeshMethod_${c}`).value,
                EdgeDivision: parseFloat(document.getElementById(`EdgeDivision_${c}`).value) || 0,
                InternalPressure: parseFloat(document.getElementById(`InternalPressure_${c}`).value) || 0,
                TypeOfNozzle: document.getElementById(`TypeOfNozzle_${c}`).value,
                NozzleHeight: parseFloat(document.getElementById(`NozzleHeight_${c}`).value) || 0,
                NozzleOD: parseFloat(document.getElementById(`NozzleOD_${c}`).value) || 0,
                NozzleTHK: parseFloat(document.getElementById(`NozzleTHK_${c}`).value) || 0,
                NozzleProjection: parseFloat(document.getElementById(`NozzleProjection_${c}`).value) || 0,
                HubOD: parseFloat(document.getElementById(`HubOD_${c}`).value) || 0,
                HubLength: parseFloat(document.getElementById(`HubLength_${c}`).value) || 0,
                TransitionLength: parseFloat(document.getElementById(`TransitionLength_${c}`).value) || 0,
                Pad: document.getElementById(`Pad_${c}`).value,
                PadWidth: parseFloat(pw) || 0,
                PadTHK: parseFloat(pt) || 0
            };
            payload.push(dataObj);
        }

        submitBtn.innerText = "Uploading to Server...";

        try {
            let res = await fetch(API_URL, {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json", 
                    "apikey": API_KEY, 
                    "Authorization": `Bearer ${API_KEY}`, 
                    "Prefer": "return=representation" 
                },
                body: JSON.stringify({ 
                    json_payload: payload, 
                    status: "pending", 
                    license_key: licenseKey, 
                    mac_address: macAddress 
                })
            });
            if(res.ok) {
                let data = await res.json();
                document.getElementById('jobIdDisplay').value = data[0].id;
                alert("Simulation successfully submitted! Job ID: " + data[0].id + "\nUse the Check Status button to retrieve your report.");
            } else {
                alert("Cloud Submission Failed. Please check the network.");
            }
        } catch(e) {
            alert("Network Error during submission.");
        }
        
        submitBtn.innerText = "Submit";
        submitBtn.disabled = false;
    }

    function failValidation(col, msg) {
        alert(`Error in Analysis ${col}: ${msg}`);
        let submitBtn = document.getElementById('submitBtn');
        submitBtn.innerText = "Submit";
        submitBtn.disabled = false;
        return false;
    }

    // --- CHECK STATUS ---
    async function checkStatus() {
        let jobId = document.getElementById('jobIdDisplay').value.trim();
        if(!jobId) return alert("No Job ID found. Please submit a job first.");
        
        try {
            let res = await fetch(`${API_URL}?id=eq.${jobId}&select=status,result_url`, {
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
            });
            let data = await res.json();
            if(data.length > 0) {
                if (data[0].status === 'completed') {
                    alert("Simulation Complete! Use Download Report to get your files.");
                } else if (data[0].status === 'processing') {
                    alert("Simulation is currently running on the server. Please wait...");
                } else if (data[0].status === 'pending') {
                    alert("Job is in queue waiting to be processed.");
                } else {
                    alert("Status: " + data[0].status);
                }
            } else {
                alert("Job ID not found in database.");
            }
        } catch(e) { 
            alert("Error checking status.");
        }
    }

    // --- DOWNLOAD REPORT ---
    async function downloadReport() {
        let jobId = document.getElementById('jobIdDisplay').value.trim();
        if(!jobId) return alert("No Job ID found. Please submit a job first.");
        
        try {
            let res = await fetch(`${API_URL}?id=eq.${jobId}&select=status,result_url`, {
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
            });
            let data = await res.json();
            if(data.length > 0) {
                if (data[0].status === 'completed' && data[0].result_url) {
                    alert("Simulation Complete! Downloading your report...");
                    window.open(data[0].result_url, '_blank');
                } else {
                    alert("Report is not ready yet. Current Status: " + data[0].status);
                }
            } else {
                alert("Job ID not found.");
            }
        } catch(e) { 
            alert("Error trying to download.");
        }
    }

    // --- INITIALIZE ---
    window.onload = renderGrid;
</script>
</body>
</html>
