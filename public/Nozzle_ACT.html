<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nozzle Analysis Batch Mode Wizard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
            color: #000;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-title {
            color: #800080;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: left;
            width: 100%;
            max-width: 1200px;
        }
        .top-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            margin-bottom: 20px;
        }
        .control-box {
            display: flex;
            border: 2px solid #000;
            background: #fff;
        }
        .control-label {
            background: #d1d5db;
            padding: 5px 15px;
            font-weight: bold;
            border-right: 2px solid #000;
        }
        .control-input {
            padding: 5px 15px;
            border: none;
            outline: none;
            width: 60px;
            text-align: center;
            font-weight: bold;
        }
        .btn-action {
            background: #e0f2fe;
            border: 1px solid #000;
            border-radius: 12px;
            padding: 6px 15px;
            cursor: pointer;
            font-weight: bold;
            color: #0369a1;
        }
        .btn-action:hover {
            background: #bae6fd;
        }
        .grid-container {
            width: 100%;
            max-width: 1200px;
            overflow-x: auto;
            background: #fff;
            border: 2px solid #000;
            padding: 10px;
        }
        .section-header {
            background-color: #bbf7d0;
            text-align: center;
            font-weight: bold;
            border: 1px solid #000;
            padding: 5px;
            margin-top: 15px;
        }
        .data-row {
            display: flex;
            border-left: 1px solid #000;
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
        }
        .data-row:first-of-type {
            border-top: 1px solid #000;
        }
        .cell-label {
            width: 250px;
            min-width: 250px;
            padding: 5px;
            border-right: 1px solid #000;
            text-align: center;
            background: #fff;
        }
        .cell-input-wrapper {
            flex: 1;
            min-width: 150px;
            border-right: 1px solid #000;
            position: relative;
        }
        .cell-input-wrapper:last-child {
            border-right: none;
        }
        .cell-input {
            width: 100%;
            height: 100%;
            border: none;
            outline: none;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
            background: transparent;
        }
        .cell-input:disabled {
            background-color: #e5e7eb;
        }
        .bottom-actions {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .btn-submit {
            background: #fff;
            color: #16a34a;
            border: 1px solid #16a34a;
            padding: 5px 20px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-download {
            background: #1e3a8a;
            color: #fff;
            border: 1px solid #000;
            padding: 5px 20px;
            cursor: pointer;
        }
        .status-box {
            display: flex;
            border: 1px solid #000;
            margin-top: 10px;
        }
        .status-label {
            background: #e5e7eb;
            padding: 5px 15px;
            border-right: 1px solid #000;
        }
        .status-input {
            width: 300px;
            padding: 5px;
            border: none;
            outline: none;
        }
        .autocomplete-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: #fff;
            border: 1px solid #000;
            z-index: 100;
            display: none;
            max-height: 150px;
            overflow-y: auto;
        }
        .autocomplete-item {
            padding: 5px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            font-size: 12px;
        }
        .autocomplete-item:hover {
            background: #f3f4f6;
        }
    </style>
</head>
<body>

    <div class="header-title">Nozzle Analysis Batch Mode Wizard</div>

    <div class="top-controls">
        <div class="control-box">
            <div class="control-label">No of Analysis</div>
            <input type="number" id="numAnalyses" class="control-input" value="1" min="1" max="20" onchange="renderGrid()">
        </div>
        <button class="btn-action" onclick="renderGrid()">Add Analysis</button>
        <button class="btn-action" onclick="searchJobModal()">See Material Availability</button>
    </div>

    <div class="grid-container" id="mainGrid"></div>

    <div class="bottom-actions">
        <button class="btn-submit" onclick="submitBatch()">Submit</button>
        <button class="btn-download" onclick="downloadReport()">Download Report</button>
        <div class="status-box">
            <button class="status-label" onclick="checkStatus()" style="border:none; border-right:1px solid #000; cursor:pointer;">Check Status</button>
            <input type="text" id="jobIdDisplay" class="status-input" placeholder="Job ID will appear here...">
        </div>
    </div>

<script>
    const API_URL = "https://mkmkhkuhzprlnjzcouei.supabase.co/rest/v1/ansys_jobs";
    const API_KEY = "YOUR_SUPABASE_ANON_KEY";
    const GAS_URL = "https://script.google.com/macros/s/AKfycby-oOC4MImsnlW5VgehlD7OPe0uNGy35m0jbExMiKqvORC6FLRUpmYE3BbL3fdqD0BQ/exec";
    const supabase = supabase.createClient("https://mkmkhkuhzprlnjzcouei.supabase.co", API_KEY);

    const layoutParams = [
        {
            section: "Project Parameters",
            fields: [
                { id: "TypeOfAnalysis", label: "Type of Analysis", type: "select", options: ["Elastic Analysis", "Limit-Load Analysis", "E-P Analysis", "Local E-P Analysis"] },
                { id: "MaterialName", label: "Material Name", type: "text", hasAutocomplete: true },
                { id: "OtherMaterialName", label: "Other Material Name", type: "text" },
                { id: "YoungsModulus", label: "Young's Modulus", type: "number" },
                { id: "PoissonsRatio", label: "Poisson's Ratio", type: "number" },
                { id: "YieldStress", label: "Yield Stress", type: "number" },
                { id: "UltimateTensileStrength", label: "Ultimate Tensile Strength", type: "number" },
                { id: "AnalysisFolder", label: "Analysis Folder", type: "text", def: "D:\\Test\\Check9" }
            ]
        },
        {
            section: "Shell Parameters",
            fields: [
                { id: "ShellOD", label: "Shell OD", type: "number", def: "1000.0" },
                { id: "ShellTHK", label: "Shell THK", type: "number", def: "25.0" },
                { id: "ShellHeight", label: "Shell Height", type: "number", def: "1000.0" },
                { id: "NozzleOffset", label: "Nozzle Offset", type: "number", def: "0.0" }
            ]
        },
        {
            section: "Nozzle Parameters",
            fields: [
                { id: "TypeOfNozzle", label: "Type of Nozzle", type: "select", options: ["Straight", "Barrel"], def: "Straight" },
                { id: "NozzleHeight", label: "Nozzle Height", type: "number", def: "500.0" },
                { id: "NozzleOD", label: "Nozzle OD", type: "number", def: "150.0" },
                { id: "NozzleTHK", label: "Nozzle THK", type: "number", def: "15.0" },
                { id: "NozzleProjection", label: "Nozzle Projection", type: "number", def: "775.0" },
                { id: "HubOD", label: "Hub OD", type: "number", def: "250.0" },
                { id: "HubLength", label: "Hub Length", type: "number", def: "150.0" },
                { id: "TransitionLength", label: "Transition Length", type: "number", def: "75.0" },
                { id: "Pad", label: "Pad", type: "select", options: ["Yes", "No"], def: "No" },
                { id: "PadWidth", label: "Pad Width", type: "number" },
                { id: "PadTHK", label: "Pad THK", type: "number" }
            ]
        },
        {
            section: "Meshings & BCs",
            fields: [
                { id: "GlobalBodySizing", label: "Global Body Sizing", type: "number", def: "20.0" },
                { id: "MeshMethod", label: "Mesh Method", type: "select", options: ["Sweep", "MultiZone", "HexDominant", "Automatic"], def: "Sweep" },
                { id: "EdgeDivision", label: "Edge Division", type: "number", def: "3.00" },
                { id: "InternalPressure", label: "Internal Pressure", type: "number", def: "12.00" }
            ]
        },
        {
            section: "Load Conditions",
            fields: [
                { id: "NozzleLoadingLocation", label: "Nozzle Loading Location", type: "select", options: ["Shell Nozzle Junction", "Nozzle Flange Junction"], def: "Shell Nozzle Junction" },
                { id: "FL", label: "F_L", type: "number", def: "1000.0" },
                { id: "Fa", label: "F_a", type: "number", def: "1200.0" },
                { id: "FC", label: "F_C", type: "number", def: "1000.0" },
                { id: "MC", label: "M_C", type: "number", def: "10000.0" },
                { id: "MT", label: "M_T", type: "number", def: "20000.0" },
                { id: "ML", label: "M_L", type: "number", def: "10000.0" }
            ]
        },
        {
            section: "Report Parameters",
            fields: [
                { id: "DesignTemp", label: "Design Temp.", type: "number", def: "145.0" },
                { id: "CorrosionAllowance", label: "Corrosion Allowance", type: "number", def: "1.5" },
                { id: "AllowableStress", label: "Allowable Stress", type: "number", def: "230.0" }
            ]
        }
    ];

    function getDeviceId() {
        let id = localStorage.getItem('NOVA_Device_ID');
        if (!id) {
            id = crypto.randomUUID().replace(/-/g, '');
            localStorage.setItem('NOVA_Device_ID', id);
        }
        return id;
    }

    function renderGrid() {
        let cols = parseInt(document.getElementById('numAnalyses').value) || 1;
        let html = '';
        
        layoutParams.forEach(section => {
            html += `<div class="section-header">${section.section}</div>`;
            section.fields.forEach(field => {
                html += `<div class="data-row"><div class="cell-label">${field.label}</div>`;
                for (let c = 1; c <= cols; c++) {
                    let cellId = `${field.id}_${c}`;
                    html += `<div class="cell-input-wrapper">`;
                    if (field.type === 'select') {
                        html += `<select id="${cellId}" class="cell-input" onchange="runLogic(${c})">`;
                        field.options.forEach(opt => {
                            let sel = (field.def === opt) ? 'selected' : '';
                            html += `<option value="${opt}" ${sel}>${opt}</option>`;
                        });
                        html += `</select>`;
                    } else {
                        let evts = field.hasAutocomplete ? `autocomplete="off" oninput="materialSearch(this, ${c})" onchange="runLogic(${c})"` : `oninput="runLogic(${c})"`;
                        html += `<input type="${field.type}" id="${cellId}" class="cell-input" value="${field.def || ''}" ${evts}>`;
                        if (field.hasAutocomplete) {
                            html += `<div id="dd_${cellId}" class="autocomplete-dropdown"></div>`;
                        }
                    }
                    html += `</div>`;
                }
                html += `</div>`;
            });
        });
        document.getElementById('mainGrid').innerHTML = html;
        for (let c = 1; c <= cols; c++) runLogic(c);
    }

    async function materialSearch(inputElem, col) {
        let dropdown = document.getElementById(`dd_${inputElem.id}`);
        let q = inputElem.value.trim();
        if (!q) { dropdown.style.display = 'none'; return; }
        
        const { data, error } = await supabase.from('materials').select('name').ilike('name', `%${q}%`).limit(4);
        if (error || !data || data.length === 0) { dropdown.style.display = 'none'; return; }
        
        dropdown.innerHTML = data.map(m => `<div class="autocomplete-item" onclick="selectMat('${m.name}', '${inputElem.id}', ${col})">${m.name}</div>`).join('');
        dropdown.style.display = 'block';
    }

    function selectMat(val, id, col) {
        document.getElementById(id).value = val;
        document.getElementById(`dd_${id}`).style.display = 'none';
        runLogic(col);
    }

    document.addEventListener('click', e => {
        document.querySelectorAll('.autocomplete-dropdown').forEach(d => { if(!d.contains(e.target)) d.style.display = 'none'; });
    });

    function runLogic(c) {
        let typeObj = document.getElementById(`TypeOfAnalysis_${c}`);
        let matObj = document.getElementById(`MaterialName_${c}`);
        let padObj = document.getElementById(`Pad_${c}`);
        
        if(!typeObj || !matObj || !padObj) return;
        
        let analysisType = typeObj.value;
        let material = matObj.value.toUpperCase();
        let padVal = padObj.value.toUpperCase();

        const setState = (id, enabled, clr) => {
            let el = document.getElementById(`${id}_${c}`);
            if(el) { el.disabled = !enabled; if(!enabled && clr) el.value = ''; }
        }

        if (padVal === "NO") {
            setState('PadWidth', false, true);
            setState('PadTHK', false, true);
        } else {
            setState('PadWidth', true, false);
            setState('PadTHK', true, false);
        }

        if (analysisType === "Elastic Analysis" || analysisType === "Limit-Load Analysis") {
            setState('YieldStress', false, true);
        } else {
            setState('YieldStress', true, false);
        }

        if (analysisType !== "Elastic Analysis") {
            setState('AllowableStress', false, true);
        } else {
            setState('AllowableStress', true, false);
        }

        if (analysisType !== "Elastic Analysis" && analysisType !== "Limit-Load Analysis") {
            setState('UltimateTensileStrength', true, false);
        } else {
            setState('UltimateTensileStrength', false, true);
        }

        if (material !== "OTHER MATERIAL") {
            setState('OtherMaterialName', false, true);
            setState('YoungsModulus', false, true);
            setState('PoissonsRatio', false, true);
            setState('YieldStress', false, true);
            setState('UltimateTensileStrength', false, true);
        } else {
            setState('OtherMaterialName', true, false);
            setState('YoungsModulus', true, false);
            setState('PoissonsRatio', true, false);
        }
    }

    async function verifyLicense(licenseKey, macAddress) {
        try {
            let res = await fetch(`${GAS_URL}?action=verify&license_key=${licenseKey}&mac_address=${macAddress}`);
            let text = await res.text();
            if (text.includes('"status":"success"')) return true;
            alert("License Verification Failed: " + text);
            return false;
        } catch (e) {
            alert("Server Connection Error");
            return false;
        }
    }

    async function submitBatch() {
        let cols = parseInt(document.getElementById('numAnalyses').value) || 1;
        let licenseKey = localStorage.getItem("NOVA_LicenseKey");
        if (!licenseKey) {
            licenseKey = prompt("Please enter your registered License Key:");
            if (!licenseKey) return;
            localStorage.setItem("NOVA_LicenseKey", licenseKey);
        }
        
        let macAddress = getDeviceId();
        let isLicensed = await verifyLicense(licenseKey, macAddress);
        if (!isLicensed) {
            localStorage.removeItem("NOVA_LicenseKey");
            return;
        }

        let payload = [];
        for (let c = 1; c <= cols; c++) {
            let mat = document.getElementById(`MaterialName_${c}`).value.toUpperCase();
            let analysisType = document.getElementById(`TypeOfAnalysis_${c}`).value;
            let pad = document.getElementById(`Pad_${c}`).value.toUpperCase();

            let yv = (mat === "OTHER MATERIAL") ? document.getElementById(`YoungsModulus_${c}`).value : "0";
            let pv = (mat === "OTHER MATERIAL") ? document.getElementById(`PoissonsRatio_${c}`).value : "0";
            let om = (mat === "OTHER MATERIAL") ? document.getElementById(`OtherMaterialName_${c}`).value : "0";
            
            let yld = "0";
            let uts = "0";
            if (mat === "OTHER MATERIAL") {
                if (analysisType !== "Elastic Analysis") yld = document.getElementById(`YieldStress_${c}`).value;
                if (analysisType !== "Elastic Analysis" && analysisType !== "Limit-Load Analysis") uts = document.getElementById(`UltimateTensileStrength_${c}`).value;
            }

            let pw = (pad === "YES") ? document.getElementById(`PadWidth_${c}`).value : "0";
            let pt = (pad === "YES") ? document.getElementById(`PadTHK_${c}`).value : "0";
            let allw = (analysisType === "Elastic Analysis") ? document.getElementById(`AllowableStress_${c}`).value : "0";

            let dataObj = {
                AnalysisID: c,
                MaterialName: document.getElementById(`MaterialName_${c}`).value,
                YoungsModulus: parseFloat(yv) || 0,
                PoissonsRatio: parseFloat(pv) || 0,
                OtherMaterialName: om,
                YieldStress: parseFloat(yld) || 0,
                UltimateTensileStrength: parseFloat(uts) || 0,
                AnalysisFolder: document.getElementById(`AnalysisFolder_${c}`).value.replace(/\\/g, "\\\\"),
                TypeOfAnalysis: analysisType,
                DesignTemp: parseFloat(document.getElementById(`DesignTemp_${c}`).value) || 0,
                CorrosionAllowance: parseFloat(document.getElementById(`CorrosionAllowance_${c}`).value) || 0,
                AllowableStress: parseFloat(allw) || 0,
                ShellOD: parseFloat(document.getElementById(`ShellOD_${c}`).value) || 0,
                ShellTHK: parseFloat(document.getElementById(`ShellTHK_${c}`).value) || 0,
                ShellHeight: parseFloat(document.getElementById(`ShellHeight_${c}`).value) || 0,
                NozzleOffset: parseFloat(document.getElementById(`NozzleOffset_${c}`).value) || 0,
                NozzleLoadingLocation: document.getElementById(`NozzleLoadingLocation_${c}`).value,
                FL: parseFloat(document.getElementById(`FL_${c}`).value) || 0,
                Fa: parseFloat(document.getElementById(`Fa_${c}`).value) || 0,
                FC: parseFloat(document.getElementById(`FC_${c}`).value) || 0,
                MC: parseFloat(document.getElementById(`MC_${c}`).value) || 0,
                MT: parseFloat(document.getElementById(`MT_${c}`).value) || 0,
                ML: parseFloat(document.getElementById(`ML_${c}`).value) || 0,
                GlobalBodySizing: parseFloat(document.getElementById(`GlobalBodySizing_${c}`).value) || 0,
                MeshMethod: document.getElementById(`MeshMethod_${c}`).value,
                EdgeDivision: parseFloat(document.getElementById(`EdgeDivision_${c}`).value) || 0,
                InternalPressure: parseFloat(document.getElementById(`InternalPressure_${c}`).value) || 0,
                TypeOfNozzle: document.getElementById(`TypeOfNozzle_${c}`).value,
                NozzleHeight: parseFloat(document.getElementById(`NozzleHeight_${c}`).value) || 0,
                NozzleOD: parseFloat(document.getElementById(`NozzleOD_${c}`).value) || 0,
                NozzleTHK: parseFloat(document.getElementById(`NozzleTHK_${c}`).value) || 0,
                NozzleProjection: parseFloat(document.getElementById(`NozzleProjection_${c}`).value) || 0,
                HubOD: parseFloat(document.getElementById(`HubOD_${c}`).value) || 0,
                HubLength: parseFloat(document.getElementById(`HubLength_${c}`).value) || 0,
                TransitionLength: parseFloat(document.getElementById(`TransitionLength_${c}`).value) || 0,
                Pad: document.getElementById(`Pad_${c}`).value,
                PadWidth: parseFloat(pw) || 0,
                PadTHK: parseFloat(pt) || 0
            };
            payload.push(dataObj);
        }

        try {
            let res = await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json", "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}`, "Prefer": "return=representation" },
                body: JSON.stringify({ json_payload: payload, status: "pending", license_key: licenseKey, mac_address: macAddress })
            });
            if(res.ok) {
                let data = await res.json();
                document.getElementById('jobIdDisplay').value = data[0].id;
                alert("Simulation successfully submitted! Job ID: " + data[0].id);
            } else {
                alert("Cloud Submission Failed.");
            }
        } catch(e) {
            alert("Network Error");
        }
    }

    async function checkStatus() {
        let jobId = document.getElementById('jobIdDisplay').value.trim();
        if(!jobId) return alert("Enter Job ID");
        try {
            let res = await fetch(`${API_URL}?id=eq.${jobId}&select=status,result_url`, {
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
            });
            let data = await res.json();
            if(data.length > 0) alert("Status: " + data[0].status);
        } catch(e) { }
    }

    async function downloadReport() {
        let jobId = document.getElementById('jobIdDisplay').value.trim();
        if(!jobId) return alert("Enter Job ID");
        try {
            let res = await fetch(`${API_URL}?id=eq.${jobId}&select=status,result_url`, {
                headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
            });
            let data = await res.json();
            if(data.length > 0 && data[0].status === 'completed' && data[0].result_url) {
                window.open(data[0].result_url, '_blank');
            } else {
                alert("Report is not ready yet. Current Status: " + (data[0] ? data[0].status : "Not Found"));
            }
        } catch(e) { }
    }

    window.onload = renderGrid;
</script>
</body>
</html>
