<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <title>NOVA Nozzle Analysis - Enterprise Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #020617;
            --bg-glow-1: #0284c7;
            --bg-glow-2: #4338ca;
            --bg-glow-3: #0f766e;
            --card-bg: rgba(15, 23, 42, 0.6);
            --card-border: rgba(255, 255, 255, 0.05);
            --card-highlight: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(2, 6, 23, 0.7);
            --input-border: rgba(255, 255, 255, 0.1);
            --input-focus: rgba(56, 189, 248, 0.4);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) transparent;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        
        body {
            height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-main);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        input[type="text"], input[type="number"], .glass-input {
            cursor: text;
        }

        button, .btn-glass, .btn-submit, select, .glass-select, .slider, .autocomplete-item, .close-modal, label.switch {
            cursor: pointer;
        }

        .ambient-orb {
            position: fixed; border-radius: 50%; filter: blur(130px);
            z-index: -1; opacity: 0.4; animation: float 25s infinite alternate ease-in-out;
            pointer-events: none;
        }
        .orb-1 { width: 45vw; height: 45vw; background: var(--bg-glow-1); top: -15vh; left: -10vw; }
        .orb-2 { width: 35vw; height: 35vw; background: var(--bg-glow-2); bottom: -10vh; right: 5vw; animation-delay: -7s; }
        .orb-3 { width: 30vw; height: 30vw; background: var(--bg-glow-3); top: 30vh; left: 35vw; animation-delay: -12s; opacity: 0.3; }
        
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 40px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.9); }
        }

        .app-header-container {
            padding: 1.25rem 2rem 0 2rem;
            z-index: 100;
        }
        
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 0.85rem 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255,255,255,0.1);
        }
        
        .app-header h1 {
            font-size: 1.2rem; font-weight: 800; letter-spacing: 1.5px;
            background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            display: flex; align-items: center; gap: 10px;
        }
        
        .app-header h1::before {
            content: ''; width: 24px; height: 24px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="%2338bdf8"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>') center/cover;
        }

        .header-controls { display: flex; gap: 0.75rem; align-items: center; }
        
        .btn-glass {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-main);
            padding: 0.5rem 1.25rem;
            border-radius: 10px;
            font-size: 0.85rem; font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative; overflow: hidden;
        }
        .btn-glass::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }
        .btn-glass:hover::before { left: 100%; }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-1px);
        }
        .btn-glass.active {
            background: rgba(56, 189, 248, 0.15);
            border-color: var(--accent);
            color: var(--accent);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .batch-bar {
            margin: 1rem 2rem 0 2rem;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(15px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 0.6rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 2rem;
            z-index: 99;
        }

        .batch-toggle-group {
            display: flex; align-items: center; gap: 0.75rem;
            font-size: 0.9rem; font-weight: 600; color: #cbd5e1;
        }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(255,255,255,0.1); transition: .3s; border-radius: 24px;
            border: 1px solid var(--card-border);
        }
        .slider:before {
            position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px;
            background-color: #94a3b8; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); border-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); background-color: white; }

        .batch-input-group {
            display: flex; align-items: center; gap: 0.75rem; transition: opacity 0.3s;
        }
        .batch-input-group.hidden { display: none !important; }
        .batch-input-group input { width: 70px; padding: 0.3rem; text-align: center; }

        .main-workspace {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #forms-container {
            width: 100%;
            max-width: 1750px;
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            padding-bottom: 120px;
        }

        .analysis-block {
            display: flex; flex-direction: column; gap: 1.25rem;
        }

        .block-header {
            font-size: 1.15rem; font-weight: 800; color: var(--accent);
            text-transform: uppercase; letter-spacing: 1.5px;
            border-bottom: 2px solid rgba(56, 189, 248, 0.3);
            padding-bottom: 0.5rem; margin-bottom: 0.5rem;
            display: flex; align-items: center; gap: 10px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 1.25rem; align-content: start;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.05);
            display: flex; flex-direction: column; overflow: visible;
        }

        .card-header {
            font-size: 0.95rem; font-weight: 700; color: #f1f5f9;
            background: rgba(255,255,255,0.02); padding: 1.1rem 1.25rem;
            border-bottom: 1px solid var(--card-border); border-radius: 16px 16px 0 0;
            display: flex; align-items: center; gap: 0.5rem;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .card-header::before {
            content: ''; width: 4px; height: 16px; background: var(--accent); border-radius: 4px;
        }

        .card-body {
            padding: 1.25rem; display: flex; flex-direction: column; gap: 0.6rem;
        }

        .section-label {
            font-size: 0.75rem; font-weight: 800; color: var(--accent);
            margin: 0.5rem 0 0.25rem 0; text-transform: uppercase; letter-spacing: 1.5px;
            border-bottom: 1px dashed rgba(56, 189, 248, 0.2); padding-bottom: 0.25rem;
        }
        .section-label:first-child { margin-top: 0; }

        .form-group {
            display: flex; align-items: center; gap: 10px; position: relative;
        }
        .form-group.hidden { display: none !important; }
        
        .form-label {
            flex: 0 0 42%; font-size: 0.8rem; font-weight: 500; color: var(--text-muted); line-height: 1.2;
        }

        .input-control { flex: 1; position: relative; }

        .glass-input, .glass-select {
            width: 100%; padding: 0.55rem 0.8rem; background: var(--input-bg);
            border: 1px solid var(--input-border); border-radius: 8px;
            font-size: 0.85rem; color: var(--text-main); transition: all 0.3s ease;
            outline: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }
        .glass-select option { background: #0f172a; color: var(--text-main); }
        
        .glass-input:focus, .glass-select:focus {
            border-color: var(--accent); background: rgba(2, 6, 23, 0.9);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px var(--input-focus);
        }
        
        .input-addon-group {
            display: flex; align-items: center; background: var(--input-bg);
            border: 1px solid var(--input-border); border-radius: 8px; transition: all 0.3s ease; overflow: hidden;
        }
        .input-addon-group:focus-within {
            border-color: var(--accent); box-shadow: 0 0 0 3px var(--input-focus);
        }
        .input-addon-group .glass-input { border: none; background: transparent; box-shadow: none; border-radius: 0; padding-right: 4px; }
        .addon {
            padding: 0 8px; color: var(--text-muted); font-size: 0.75rem; font-weight: 700;
            background: rgba(255,255,255,0.02); height: 100%; display: flex; align-items: center;
            border-left: 1px solid var(--input-border);
        }

        .autocomplete-list {
            position: absolute; top: calc(100% + 4px); left: 0; right: 0;
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--accent); border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); z-index: 1000; display: none;
            max-height: 200px; overflow-y: auto;
        }
        .autocomplete-item {
            padding: 10px 12px; color: var(--text-main); font-size: 0.85rem;
            border-bottom: 1px solid rgba(255,255,255,0.05); transition: all 0.2s;
        }
        .autocomplete-item:hover { background: rgba(56, 189, 248, 0.15); color: var(--accent); padding-left: 16px; }

        .sticky-footer {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 1.25rem 2rem; background: rgba(2, 6, 23, 0.85);
            backdrop-filter: blur(20px); border-top: 1px solid var(--card-border);
            display: flex; justify-content: center; z-index: 100;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, #4338ca 100%);
            border: 1px solid rgba(255,255,255,0.2); border-top: 1px solid rgba(255,255,255,0.4);
            color: white; padding: 0.85rem 4rem; border-radius: 12px;
            font-weight: 800; font-size: 1rem; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 1.5px; text-transform: uppercase;
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-3px); box-shadow: 0 15px 35px rgba(59, 130, 246, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #2563eb 100%);
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modal-box {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 16px; padding: 2.5rem; width: 90%; max-width: 600px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7); position: relative;
        }
        .close-modal { position: absolute; top: 15px; right: 20px; background: none; border: none; color: white; font-size: 1.75rem; transition: color 0.2s; }
        .close-modal:hover { color: #ef4444; }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="app-header-container">
        <header class="app-header">
            <h1 id="main_title">NOVA Analysis Hub</h1>
            <div class="header-controls">
                <button type="button" class="btn-glass active" id="btn-shell" onclick="switchAnalysis('shell')">Shell Nozzle</button>
                <button type="button" class="btn-glass" id="btn-head" onclick="switchAnalysis('head')">Vessel Head</button>
                <div style="width: 1px; height: 16px; background: rgba(255,255,255,0.2); margin: 0 5px;"></div>
                <button class="btn-glass" type="button" onclick="openSearchModal()">Job Repository</button>
            </div>
        </header>
    </div>
    
    <div class="batch-bar">
        <div class="batch-toggle-group">
            <span>Batch Mode Deployment</span>
            <label class="switch">
                <input type="checkbox" id="batchToggle" onchange="toggleBatchMode()">
                <span class="slider"></span>
            </label>
        </div>
        <div class="batch-input-group hidden" id="batchCountContainer">
            <span style="font-size:0.85rem; font-weight:700; color:#e2e8f0; text-transform:uppercase; letter-spacing:1px;">Configurations:</span>
            <input type="number" class="glass-input" id="numAnalyses" value="1" min="1" max="20" onchange="renderForms()">
        </div>
    </div>

    <div class="main-workspace">
        <form id="forms-container">
        </form>
    </div>

    <div class="sticky-footer">
        <button class="btn-submit" type="button" onclick="submitAnalysis()">Submit Analysis to Cloud</button>
    </div>

    <div class="modal-overlay" id="searchModal">
        <div class="modal-box">
            <button class="close-modal" onclick="closeSearchModal()">&times;</button>
            <h2 style="margin-bottom:1.5rem; font-weight:800; color:var(--accent); font-size:1.2rem; text-transform:uppercase; letter-spacing:1px;">Job Repository</h2>
            <div style="display:flex; gap:10px; margin-bottom:1.5rem;">
                <input type="text" id="searchInput" class="glass-input" placeholder="Enter Job ID or License Key...">
                <button class="btn-glass" style="padding: 0 1.5rem;" onclick="searchJobs()">Search</button>
            </div>
            <div id="jobResults" style="max-height:300px; overflow-y:auto; padding-right:10px;"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://mkmkhkuhzprlnjzcouei.supabase.co/rest/v1/ansys_jobs";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rbWtoa3VoenBybG5qemNvdWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTk1NTEsImV4cCI6MjA5ODQ3NTU1MX0.lFC60895V5YplDhcHwmAEqN2LjRNttc8_AW_faWP-fY";
        
        let currentAnalysis = "shell";
        let materialLibrary = [];

        function toggleBatchMode() {
            const isBatch = document.getElementById('batchToggle').checked;
            const container = document.getElementById('batchCountContainer');
            if(isBatch) {
                container.classList.remove('hidden');
                document.getElementById('numAnalyses').value = 2;
            } else {
                container.classList.add('hidden');
                document.getElementById('numAnalyses').value = 1;
            }
            renderForms();
        }

        function getFormTemplate(i, isBatch) {
            return `
            <div class="analysis-block" id="block_${i}">
                ${isBatch ? `<div class="block-header">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Configuration Set ${i}
                </div>` : ''}
                <div class="dashboard-grid">
                    
                    <div class="glass-card">
                        <div class="card-header">1. Project & Conditions</div>
                        <div class="card-body">
                            <div class="form-group" id="grp_AnalysisFolder_${i}">
                                <label class="form-label">Analysis Folder</label>
                                <div class="input-control"><input type="text" class="glass-input" name="AnalysisFolder_${i}" id="AnalysisFolder_${i}" value="D:\\Test\\Check1"></div>
                            </div>
                            <div class="form-group" id="grp_TypeOfAnalysis_${i}">
                                <label class="form-label">Type Of Analysis</label>
                                <div class="input-control">
                                    <select class="glass-select" name="TypeOfAnalysis_${i}" id="TypeOfAnalysis_${i}" onchange="evaluateDependencies(${i})">
                                        <option value="Elastic Analysis">Elastic Analysis</option>
                                        <option value="Limit-Load Analysis">Limit-Load Analysis</option>
                                        <option value="Elastic-Plastic Analysis">Elastic-Plastic Analysis</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group hidden" id="grp_LimitLoadModel_${i}">
                                <label class="form-label">Material Model</label>
                                <div class="input-control">
                                    <select class="glass-select" name="LimitLoadModel_${i}" id="LimitLoadModel_${i}">
                                        <option value="Elastic">Elastic</option>
                                        <option value="Elastic-Plastic">Elastic-Plastic</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group" id="grp_DesignTemp_${i}">
                                <label class="form-label">Design Temp</label>
                                <div class="input-control">
                                    <div class="input-addon-group"><input type="number" class="glass-input" name="DesignTemp_${i}" id="DesignTemp_${i}" value="150" onchange="recalculateAllMaterials(${i})"><span class="addon">°C</span></div>
                                </div>
                            </div>
                            <div class="form-group" id="grp_InternalPressure_${i}">
                                <label class="form-label">Internal Pressure</label>
                                <div class="input-control">
                                    <div class="input-addon-group"><input type="number" class="glass-input" name="InternalPressure_${i}" id="InternalPressure_${i}" value="10"><span class="addon">MPa</span></div>
                                </div>
                            </div>

                            <div class="section-label">Operating Conditions</div>
                            <div class="form-group" id="grp_OperatingCondition_${i}">
                                <label class="form-label">Thermal Analysis?</label>
                                <div class="input-control">
                                    <select class="glass-select" name="OperatingCondition_${i}" id="OperatingCondition_${i}" onchange="evaluateDependencies(${i})">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-group hidden" id="grp_ShellIdHTC_${i}">
                                <label class="form-label">Shell ID HTC</label>
                                <div class="input-control"><input type="number" class="glass-input" name="ShellIdHTC_${i}" id="ShellIdHTC_${i}" value="100"></div>
                            </div>
                            <div class="form-group hidden" id="grp_NozzleIdHTC_${i}">
                                <label class="form-label">Nozzle ID HTC</label>
                                <div class="input-control"><input type="number" class="glass-input" name="NozzleIdHTC_${i}" id="NozzleIdHTC_${i}" value="120"></div>
                            </div>
                            <div class="form-group hidden" id="grp_OutsideHTC_${i}">
                                <label class="form-label">Outside Surface HTC</label>
                                <div class="input-control"><input type="number" class="glass-input" name="OutsideHTC_${i}" id="OutsideHTC_${i}" value="10"></div>
                            </div>
                        </div>
                    </div>

                    <div class="glass-card">
                        <div class="card-header">2. Materials</div>
                        <div class="card-body">
                            <div class="section-label">Shell Material</div>
                            <div class="form-group" id="grp_ShellMaterial_${i}">
                                <label class="form-label">Material Name</label>
                                <div class="input-control">
                                    <input type="text" class="glass-input" name="ShellMaterial_${i}" id="ShellMaterial_${i}" value="SA-516-GR-70" autocomplete="off" oninput="searchMaterial(this, ${i})" onblur="setTimeout(()=>closeLists(),200)" onchange="evaluateDependencies(${i})">
                                </div>
                            </div>
                            <div class="form-group hidden" id="grp_ShellOtherName_${i}">
                                <label class="form-label">Custom Name</label>
                                <div class="input-control"><input type="text" class="glass-input" name="ShellOtherName_${i}" id="ShellOtherName_${i}" value="Custom_Material"></div>
                            </div>
                            <div class="form-group hidden" id="grp_ShellYM_${i}">
                                <label class="form-label">Young's Modulus</label>
                                <div class="input-control"><div class="input-addon-group"><input type="number" class="glass-input" name="ShellYM_${i}" id="ShellYM_${i}" value="200000"><span class="addon">MPa</span></div></div>
                            </div>
                            <div class="form-group hidden" id="grp_ShellPR_${i}">
                                <label class="form-label">Poisson's Ratio</label>
                                <div class="input-control"><input type="number" class="glass-input" name="ShellPR_${i}" id="ShellPR_${i}" value="0.3"></div>
                            </div>

        function renderForms() {

            for(let i=1; i<=total; i++) {

            container.innerHTML = html;
            
            for(let i=1; i<=total; i++) {

        function toggleVisibility(id, show) {
            const el = document.getElementById(id);
            if(el) {
                if(show) el.classList.remove('hidden');
                else el.classList.add('hidden');
            }
        }

        function evaluateDependencies(i) {
            const typeOfAnalysis = document.getElementById(`TypeOfAnalysis_${i}`).value;
            const opCondition = document.getElementById(`OperatingCondition_${i}`).value;
            const padReq = document.getElementById(`PadRequired_${i}`).value;
            const nozzleType = document.getElementById(`TypeOfNozzle_${i}`).value;

            toggleVisibility(`grp_LimitLoadModel_${i}`, typeOfAnalysis === 'Limit-Load Analysis');

            const showThermal = opCondition === 'Yes';
            toggleVisibility(`grp_ShellIdHTC_${i}`, showThermal);
            toggleVisibility(`grp_NozzleIdHTC_${i}`, showThermal);
            toggleVisibility(`grp_OutsideHTC_${i}`, showThermal);
            
            const isSRN = nozzleType === 'SRN';
            toggleVisibility(`grp_HubOD_${i}`, isSRN);
            toggleVisibility(`grp_HubLength_${i}`, isSRN);
            toggleVisibility(`grp_TransitionLength_${i}`, isSRN);

            const handleMaterialGroup = (prefix, isActive) => {
                if(!isActive) {
                    toggleVisibility(`grp_${prefix}Material_${i}`, false);
                    toggleVisibility(`grp_${prefix}OtherName_${i}`, false);
                    toggleVisibility(`grp_${prefix}YM_${i}`, false);
                    toggleVisibility(`grp_${prefix}PR_${i}`, false);
                    toggleVisibility(`grp_${prefix}Allowable_${i}`, false);
                    toggleVisibility(`grp_${prefix}Yield_${i}`, false);
                    toggleVisibility(`grp_${prefix}UTS_${i}`, false);
                    return;
                }

                toggleVisibility(`grp_${prefix}Material_${i}`, true);
                const matName = document.getElementById(`${prefix}Material_${i}`).value.toLowerCase().trim();
                const isOther = matName === 'other material';
                
                toggleVisibility(`grp_${prefix}OtherName_${i}`, isOther);
                toggleVisibility(`grp_${prefix}YM_${i}`, isOther);
                toggleVisibility(`grp_${prefix}PR_${i}`, isOther);
                
                const showAllowable = isOther && typeOfAnalysis === 'Elastic Analysis';
                toggleVisibility(`grp_${prefix}Allowable_${i}`, showAllowable);
                
                const showYield = isOther && ['Limit-Load Analysis', 'Elastic-Plastic Analysis'].includes(typeOfAnalysis);
                toggleVisibility(`grp_${prefix}Yield_${i}`, showYield);
                
                const showUTS = isOther && typeOfAnalysis === 'Elastic-Plastic Analysis';
                toggleVisibility(`grp_${prefix}UTS_${i}`, showUTS);
            };

            handleMaterialGroup('Shell', true);
            handleMaterialGroup('Nozzle', true);
            
            const isPadActive = padReq === 'Yes';
            handleMaterialGroup('Pad', isPadActive);
            toggleVisibility(`grp_PadWidth_${i}`, isPadActive);
            toggleVisibility(`grp_PadTHK_${i}`, isPadActive);
        }

        async function fetchMaterialData() {
            try {
                const res = await fetch('/material.json');
                if(res.ok) materialLibrary = await res.json();
            } catch (e) {
                console.log("No local material.json found or fetch error.");
            }
        }

        function searchMaterial(inputEl, i) {
            let control = inputEl.closest('.input-control');
            let list = control.querySelector('.autocomplete-list');
            if(!list) {
                list = document.createElement('div');
                list.className = 'autocomplete-list';
                control.appendChild(list);
            }
            
            const q = inputEl.value.toLowerCase().replace(/[\s\-_]/g, "");
            if(!q) { list.style.display = 'none'; return; }
            
            let matches = materialLibrary.filter(m => m.Name && m.Name.toLowerCase().replace(/[\s\-_]/g, "").includes(q)).slice(0, 5);
            
            if ("other material".includes(q)) {
                matches.push({ Name: "other material" });
            }

            if(matches.length > 0) {
                list.innerHTML = matches.map(m => `<div class="autocomplete-item" onmousedown="selectMaterial('${m.Name}', '${inputEl.id}', ${i})">${m.Name}</div>`).join('');
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        }

        function selectMaterial(matName, inputId, i) {
            const el = document.getElementById(inputId);
            el.value = matName;
            closeLists();
            
            if(matName !== "other material") {
                autoFillProperties(matName, inputId, i);
            }
            evaluateDependencies(i);
        }

        function closeLists() {
            document.querySelectorAll('.autocomplete-list').forEach(l => l.style.display = 'none');
        }

        function autoFillProperties(matName, inputId, i) {
            const mat = materialLibrary.find(m => m.Name === matName);
            if(!mat) return;
            
            const temp = parseFloat(document.getElementById(`DesignTemp_${i}`).value) || 20;
            let prefix = "";
            if (inputId.includes("Shell")) prefix = "Shell";
            else if (inputId.includes("Nozzle")) prefix = "Nozzle";
            else if (inputId.includes("Pad")) prefix = "Pad";

            const allowEl = document.getElementById(`${prefix}Allowable_${i}`);
            const yieldEl = document.getElementById(`${prefix}Yield_${i}`);
            const utsEl = document.getElementById(`${prefix}UTS_${i}`);

            if (mat.AllowableStressData && allowEl) {
                let val = interpolateValue(mat.AllowableStressData, temp);
                if (val) allowEl.value = val.toFixed(1);
            }
            if (mat.YieldStressData && yieldEl) {
                let val = interpolateValue(mat.YieldStressData, temp);
                if (val) yieldEl.value = val.toFixed(1);
            }
            if (mat.TensileStressData && utsEl) {
                let val = interpolateValue(mat.TensileStressData, temp);
                if (val) utsEl.value = val.toFixed(1);
            }
        }

        function recalculateAllMaterials(i) {
            const shellMat = document.getElementById(`ShellMaterial_${i}`).value;
            const nozzleMat = document.getElementById(`NozzleMaterial_${i}`).value;
            const padMat = document.getElementById(`PadMaterial_${i}`).value;
            if(shellMat && shellMat !== "other material") autoFillProperties(shellMat, `ShellMaterial_${i}`, i);
            if(nozzleMat && nozzleMat !== "other material") autoFillProperties(nozzleMat, `NozzleMaterial_${i}`, i);
            if(padMat && padMat !== "other material") autoFillProperties(padMat, `PadMaterial_${i}`, i);
        }

        function interpolateValue(dataObj, targetTemp) {
            const temps = Object.keys(dataObj).map(Number).sort((a,b)=>a-b);
            if(temps.length === 0) return null;
            if(targetTemp <= temps[0]) return dataObj[temps[0]];
            if(targetTemp >= temps[temps.length-1]) return dataObj[temps[temps.length-1]];
            
            for(let j=0; j<temps.length-1; j++) {
                if(targetTemp >= temps[j] && targetTemp <= temps[j+1]) {
                    const t1 = temps[j], t2 = temps[j+1];
                    const v1 = dataObj[t1], v2 = dataObj[t2];
                    return v1 + ((targetTemp - t1) / (t2 - t1)) * (v2 - v1);
                }
            }
            return null;
        }

        function switchAnalysis(type) {
            currentAnalysis = type;
            document.getElementById('btn-shell').classList.remove('active');
            document.getElementById('btn-head').classList.remove('active');
            document.getElementById(`btn-${type}`).classList.add('active');
            document.getElementById('main_title').innerText = type === "shell" ? "Shell Nozzle Analysis" : "Vessel Head Analysis";
        }

        async function submitAnalysis() {
            const btn = document.querySelector('.btn-submit');
            const originalText = btn.innerText;
            btn.innerText = "Deploying...";
            btn.disabled = true;

            const isBatch = document.getElementById('batchToggle').checked;
            const total = isBatch ? (parseInt(document.getElementById('numAnalyses').value) || 1) : 1;
            let payloadArr = [];

            for(let i=1; i<=total; i++) {
                const payload = { AnalysisType: currentAnalysis, AnalysisID: i };
                const block = document.getElementById(`block_${i}`);
                if(!block) continue;
                
                block.querySelectorAll('input, select').forEach(el => {
                    const group = el.closest('.form-group');
                    if (group && !group.classList.contains('hidden') && el.name) {
                        let cleanName = el.name.replace(`_${i}`, '');
                        payload[cleanName] = el.type === 'number' ? parseFloat(el.value) || 0 : el.value;
                    }
                });
                payloadArr.push(payload);
            }

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`,
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        json_payload: payloadArr,
                        status: "pending"
                    })
                });
                if(res.ok) {
                    const data = await res.json();
                    alert(`Deployment Successful!\nJob ID: ${data[0].id}`);
                } else {
                    alert("Submission Failed.");
                }
            } catch(e) {
                alert("Network Error.");
            }
            btn.innerText = originalText;
            btn.disabled = false;
        }

        function openSearchModal() { document.getElementById('searchModal').classList.add('active'); }
        function closeSearchModal() { document.getElementById('searchModal').classList.remove('active'); }
        
        async function searchJobs() {
            const query = document.getElementById('searchInput').value.trim();
            const results = document.getElementById('jobResults');
            if(!query) return;
            results.innerHTML = '<p style="color:#94a3b8; font-size:0.85rem;">Searching...</p>';
            
            try {
                const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(query);
                const filter = isUUID ? `id.eq.${query}` : `license_key.eq.${query}`;
                const res = await fetch(`${API_URL}?select=id,status,created_at&${filter}`, {
                    headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
                });
                
                if(res.ok) {
                    const data = await res.json();
                    if(data.length === 0) { results.innerHTML = '<p style="color:#f59e0b; font-size:0.85rem;">No jobs found.</p>'; return; }
                    results.innerHTML = data.map(j => `<div style="background:rgba(255,255,255,0.03); padding:12px 14px; border-radius:8px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.05); display:flex; justify-content:space-between; align-items:center;"><div style="font-family:monospace; color:#94a3b8; font-size:0.85rem;">${j.id}</div><div style="font-weight:700; font-size:0.8rem; letter-spacing:1px; color:${j.status==='completed'?'#10b981':(j.status==='pending'?'#3b82f6':'#f59e0b')}">${j.status.toUpperCase()}</div></div>`).join('');
                } else {
                    results.innerHTML = '<p style="color:#ef4444; font-size:0.85rem;">Error retrieving data.</p>';
                }
            } catch(e) {
                results.innerHTML = '<p style="color:#ef4444; font-size:0.85rem;">Connection error.</p>';
            }
        }

        window.onload = () => {
            fetchMaterialData();
            renderForms();
        };
    </script>
</body>
</html>
