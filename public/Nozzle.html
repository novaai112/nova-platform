<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="/favicon.jpg">
    <title>NOVA Nozzle Analysis - Alpha Interface</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0f172a;
            --bg-glow-1: #3b82f6; 
            --bg-glow-2: #8b5cf6; 
            --bg-glow-3: #10b981;
            --glass-bg: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.6);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg-base);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
        body {
            height: 100vh;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .ambient-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(150px);
            z-index: -1;
            opacity: 0.6;
            animation: float 25s infinite alternate ease-in-out;
        }
        .orb-1 { width: 60vw; height: 60vw; background: var(--bg-glow-1); top: -20vh; left: -10vw; }
        .orb-2 { width: 50vw; height: 50vw; background: var(--bg-glow-2); bottom: -10vh; right: -5vw; animation-delay: -5s; }
        .orb-3 { width: 40vw; height: 40vw; background: var(--bg-glow-3); top: 30vh; left: 30vw; animation-delay: -10s; opacity: 0.4; }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, 50px) scale(1.05); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }
        .app-container {
            width: 95vw;
            height: 90vh;
            max-width: 1600px;
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-top: 1px solid var(--glass-highlight);
            border-radius: 24px;
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .app-header {
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            flex-shrink: 0;
        }
        .app-header h1 {
            font-size: 1.25rem; font-weight: 800; letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-controls { display: flex; gap: 1rem; align-items: center; }
        .btn-glass {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            padding: 0.6rem 1.25rem;
            border-radius: 10px;
            font-size: 0.85rem; font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .btn-glass:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-glass.active {
            background: rgba(59, 130, 246, 0.2);
            border-color: var(--primary);
            color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        .sidebar-tabs {
            width: 250px;
            border-right: 1px solid var(--glass-border);
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            background: rgba(0,0,0,0.2);
            flex-shrink: 0;
        }
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 1rem 1.5rem;
            text-align: left;
            border-radius: 12px;
            font-size: 0.95rem; font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: space-between;
        }
        .tab-btn:hover { background: rgba(255,255,255,0.05); color: var(--text-main); }
        .tab-btn.active {
            background: linear-gradient(90deg, rgba(59, 130, 246, 0.2) 0%, transparent 100%);
            color: #60a5fa;
            border-left: 3px solid var(--primary);
            border-radius: 0 12px 12px 0;
        }
        .tab-content-container {
            flex: 1;
            padding: 2rem 3rem;
            overflow-y: auto;
            position: relative;
        }
        .tab-pane { display: none; animation: fadeIn 0.4s ease forwards; }
        .tab-pane.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }
        .fields-container { display: flex; flex-direction: column; gap: 1.25rem; }
        .form-group { transition: all 0.3s ease; position: relative; }
        .form-group.hidden { display: none !important; }
        .form-label {
            display: block; font-size: 0.85rem; font-weight: 500;
            color: var(--text-muted); margin-bottom: 0.5rem;
        }
        .glass-input, .glass-select {
            width: 100%; padding: 0.9rem 1rem; background: var(--input-bg);
            border: 1px solid var(--glass-border);
            border-radius: 10px; font-size: 0.95rem; color: var(--text-main);
            transition: all 0.3s ease; outline: none;
        }
        .glass-select option { background: var(--bg-base); color: var(--text-main); }
        .glass-input:focus, .glass-select:focus {
            border-color: var(--primary); background: rgba(15, 23, 42, 0.8);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        .glass-input[readonly] { background: rgba(0, 0, 0, 0.2); color: #777; cursor: not-allowed; }
        input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .input-addon-group {
            display: flex; align-items: center; background: var(--input-bg);
            border: 1px solid var(--glass-border); border-radius: 10px;
            transition: all 0.3s ease; overflow: hidden;
        }
        .input-addon-group:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2); }
        .input-addon-group .glass-input { border: none; background: transparent; box-shadow: none; flex: 1; }
        .addon { padding: 0 1rem; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; background: rgba(0,0,0,0.2); height: 100%; display: flex; align-items: center; border-left: 1px solid var(--glass-border); }
        .action-area {
            position: absolute; bottom: 0; left: 0; width: 100%;
            padding: 1.5rem 3rem; background: rgba(15,23,42,0.8);
            backdrop-filter: blur(20px); border-top: 1px solid var(--glass-border);
            display: flex; justify-content: flex-end; z-index: 10;
        }
        .tab-content-container { padding-bottom: 100px; } 
        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
            border: 1px solid rgba(255,255,255,0.2);
            color: white; padding: 1rem 3rem; border-radius: 12px;
            font-weight: 600; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease; letter-spacing: 1px; text-transform: uppercase;
        }
        .btn-submit:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(37,99,235,0.4); }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(15px);
            display: flex; justify-content: center; align-items: center;
            z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; pointer-events: all; }
        .modern-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 40px; width: 90%; max-width: 700px;
            color: white; box-shadow: var(--glass-shadow); position: relative;
        }
        .modern-box h2 { margin-bottom: 20px; font-weight: 800; color: #60a5fa; }
        .close-modal { position: absolute; top: 20px; right: 20px; background: transparent; border: none; color: white; font-size: 1.5rem; cursor: pointer; }
        .autocomplete-list {
            position: absolute; top: calc(100% + 5px); left: 0; right: 0;
            background: #1e293b; border: 1px solid var(--glass-border);
            border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 1000; display: none; overflow: hidden;
        }
        .autocomplete-item {
            padding: 12px 15px; cursor: pointer; color: var(--text-main);
            font-size: 0.9rem; border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s ease;
        }
        .autocomplete-item:hover { background: rgba(59,130,246,0.2); color: #60a5fa; padding-left: 20px; }
    </style>
</head>
<body>
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>

    <div class="app-container">
        <header class="app-header">
            <h1 id="main_title">NOVA Analysis Hub</h1>
            <div class="header-controls">
                <div class="method-toggle">
                    <button type="button" class="btn-glass active" id="btn-shell" onclick="switchAnalysis('shell')">Shell Nozzle</button>
                    <button type="button" class="btn-glass" id="btn-head" onclick="switchAnalysis('head')">Vessel Head</button>
                </div>
                <button class="btn-glass" type="button" onclick="openSearchModal()">Check Job Status</button>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar-tabs" id="tab-nav">
            </div>
            
            <div class="tab-content-container">
                <form id="analysisForm">
                    <div id="tab-content"></div>
                </form>
                <div class="action-area">
                    <button class="btn-submit" type="button" onclick="submitAnalysis()">Deploy Analysis Model</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="searchModal">
        <div class="modern-box">
            <button class="close-modal" onclick="closeSearchModal()">&times;</button>
            <h2>Job Repository</h2>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <input type="text" id="searchInput" class="glass-input" placeholder="Enter Job ID or License Key...">
                <button class="btn-glass" onclick="searchJobs()">Search</button>
            </div>
            <div id="jobResults"></div>
        </div>
    </div>

    <script>
        const API_URL = "https://mkmkhkuhzprlnjzcouei.supabase.co/rest/v1/ansys_jobs";
        const API_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1rbWtoa3VoenBybG5qemNvdWVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4OTk1NTEsImV4cCI6MjA5ODQ3NTU1MX0.lFC60895V5YplDhcHwmAEqN2LjRNttc8_AW_faWP-fY";
        
        const formSchema = {
            tabs: [
                { id: "setup", label: "Project Setup" },
                { id: "materials", label: "Materials" },
                { id: "geometry", label: "Geometry" },
                { id: "mesh_loads", label: "Mesh & Loads" }
            ],
            fields: [
                { name: "TypeOfAnalysis", tab: "setup", label: "Analysis Type", type: "select", options: ["Elastic Analysis", "Limit-Load Analysis", "Elastic-Plastic Analysis"], value: "Elastic Analysis" },
                { name: "LimitLoadModel", tab: "setup", label: "Material Model", type: "select", options: ["Elastic", "Elastic-Plastic"], value: "Elastic", dependsOn: "TypeOfAnalysis", showIf: ["Limit-Load Analysis"] },
                { name: "OperatingCondition", tab: "setup", label: "Operating Condition Required", type: "select", options: ["No", "Yes"], value: "No" },
                { name: "AnalysisFolder", tab: "setup", label: "Analysis Folder", type: "text", value: "D:\\NOVA_Projects" },
                
                { name: "DesignTemp", tab: "materials", label: "Design Temp (°C)", type: "number", value: "150" },
                { name: "ShellMaterial", tab: "materials", label: "Shell Material", type: "text", value: "SA-516-GR-70", isMaterial: true },
                { name: "ShellAllowable", tab: "materials", label: "Shell Allowable Stress (MPa)", type: "number", value: "138", dependsOn: "TypeOfAnalysis", showIf: ["Elastic Analysis"] },
                { name: "ShellYield", tab: "materials", label: "Shell Yield Stress (MPa)", type: "number", value: "260", dependsOn: "TypeOfAnalysis", showIf: ["Limit-Load Analysis", "Elastic-Plastic Analysis"] },
                
                { name: "NozzleMaterial", tab: "materials", label: "Nozzle Material", type: "text", value: "SA-106-GR-B", isMaterial: true },
                { name: "NozzleAllowable", tab: "materials", label: "Nozzle Allowable Stress (MPa)", type: "number", value: "118", dependsOn: "TypeOfAnalysis", showIf: ["Elastic Analysis"] },
                { name: "NozzleYield", tab: "materials", label: "Nozzle Yield Stress (MPa)", type: "number", value: "240", dependsOn: "TypeOfAnalysis", showIf: ["Limit-Load Analysis", "Elastic-Plastic Analysis"] },
                
                { name: "PadRequired", tab: "materials", label: "Pad Required", type: "select", options: ["No", "Yes"], value: "No" },
                { name: "PadMaterial", tab: "materials", label: "Pad Material", type: "text", value: "SA-516-GR-70", isMaterial: true, dependsOn: "PadRequired", showIf: ["Yes"] },
                { name: "PadAllowable", tab: "materials", label: "Pad Allowable Stress (MPa)", type: "number", value: "138", dependsOn: "PadRequired", showIf: ["Yes"] },
                { name: "PadYield", tab: "materials", label: "Pad Yield Stress (MPa)", type: "number", value: "260", dependsOn: "PadRequired", showIf: ["Yes"] },

                { name: "ShellOD", tab: "geometry", label: "Shell OD (mm)", type: "number", value: "1000" },
                { name: "ShellTHK", tab: "geometry", label: "Shell Thickness (mm)", type: "number", value: "25" },
                { name: "NozzleType", tab: "geometry", label: "Nozzle Type", type: "select", options: ["Straight", "SRN"], value: "Straight" },
                { name: "NozzleOD", tab: "geometry", label: "Nozzle OD (mm)", type: "number", value: "150" },
                { name: "NozzleTHK", tab: "geometry", label: "Nozzle Thickness (mm)", type: "number", value: "15" },
                { name: "PadWidth", tab: "geometry", label: "Pad Width (mm)", type: "number", value: "50", dependsOn: "PadRequired", showIf: ["Yes"] },
                { name: "PadTHK", tab: "geometry", label: "Pad Thickness (mm)", type: "number", value: "15", dependsOn: "PadRequired", showIf: ["Yes"] },
                { name: "CorrosionAllowance", tab: "geometry", label: "Corrosion Allowance (mm)", type: "number", value: "1.5" },

                { name: "MeshSize", tab: "mesh_loads", label: "Global Mesh Size (mm)", type: "number", value: "30" },
                { name: "InternalPressure", tab: "mesh_loads", label: "Design Pressure (MPa)", type: "number", value: "5.5" },
                { name: "ShellIdHTC", tab: "mesh_loads", label: "Shell ID HTC @ Bulk Temp", type: "number", value: "100", dependsOn: "OperatingCondition", showIf: ["Yes"] },
                { name: "NozzleIdHTC", tab: "mesh_loads", label: "Nozzle ID HTC @ Bulk Temp", type: "number", value: "120", dependsOn: "OperatingCondition", showIf: ["Yes"] },
                { name: "OutsideHTC", tab: "mesh_loads", label: "Outside Surface HTC", type: "number", value: "10", dependsOn: "OperatingCondition", showIf: ["Yes"] }
            ]
        };

        let currentAnalysis = "shell";
        let activeTab = "setup";
        let materialLibrary = [];

        function parseUnit(label) {
            const match = label.match(/(.*?)\s*\((.*?)\):?/);
            if (match) return { text: match[1].trim(), unit: match[2].trim() };
            return { text: label.replace(':', '').trim(), unit: null };
        }

        function buildUI() {
            const nav = document.getElementById('tab-nav');
            const content = document.getElementById('tab-content');
            nav.innerHTML = '';
            content.innerHTML = '';

            formSchema.tabs.forEach((tab, index) => {
                const btn = document.createElement('button');
                btn.className = `tab-btn ${tab.id === activeTab ? 'active' : ''}`;
                btn.type = 'button';
                btn.innerText = tab.label;
                btn.onclick = () => switchTab(tab.id);
                nav.appendChild(btn);

                const pane = document.createElement('div');
                pane.className = `tab-pane ${tab.id === activeTab ? 'active' : ''}`;
                pane.id = `pane-${tab.id}`;

                const grid = document.createElement('div');
                grid.className = 'grid-layout';

                const tabFields = formSchema.fields.filter(f => f.tab === tab.id);
                tabFields.forEach(f => {
                    const dependsAttr = f.dependsOn ? `data-depends-on="${f.dependsOn}" data-show-if="${f.showIf.join(',')}"` : '';
                    const parsed = parseUnit(f.label);
                    
                    let html = `<div class="form-group" id="grp_${f.name}" ${dependsAttr}><label class="form-label">${parsed.text}</label>`;
                    
                    if (f.type === 'select') {
                        html += `<select class="glass-select" name="${f.name}" id="${f.name}" onchange="evaluateDependencies()">`;
                        f.options.forEach(opt => {
                            html += `<option value="${opt}" ${opt === f.value ? 'selected' : ''}>${opt}</option>`;
                        });
                        html += `</select>`;
                    } else {
                        const matEvent = f.isMaterial ? `autocomplete="off" oninput="searchMaterial(this)" onblur="setTimeout(()=>closeLists(),200)"` : '';
                        if (parsed.unit) {
                            html += `<div class="input-addon-group"><input type="${f.type}" step="any" class="glass-input" name="${f.name}" id="${f.name}" value="${f.value}" ${matEvent} onchange="evaluateDependencies()"><span class="addon">${parsed.unit}</span></div>`;
                        } else {
                            html += `<input type="${f.type}" step="any" class="glass-input" name="${f.name}" id="${f.name}" value="${f.value}" ${matEvent} onchange="evaluateDependencies()">`;
                        }
                    }
                    html += `</div>`;
                    grid.innerHTML += html;
                });

                pane.appendChild(grid);
                content.appendChild(pane);
            });

            evaluateDependencies();
            fetchMaterialData();
        }

        function switchTab(tabId) {
            activeTab = tabId;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            document.querySelector(`.tab-btn[onclick="switchTab('${tabId}')"]`).classList.add('active');
            document.getElementById(`pane-${tabId}`).classList.add('active');
        }

        function evaluateDependencies() {
            document.querySelectorAll('.form-group[data-depends-on]').forEach(group => {
                const depName = group.getAttribute('data-depends-on');
                const showVals = group.getAttribute('data-show-if').split(',');
                const masterEl = document.getElementById(depName);
                
                if (masterEl && showVals.includes(masterEl.value)) {
                    group.classList.remove('hidden');
                } else {
                    group.classList.add('hidden');
                }
            });
        }

        async function fetchMaterialData() {
            try {
                const res = await fetch('/material.json');
                if(res.ok) materialLibrary = await res.json();
            } catch (e) {}
        }

        function searchMaterial(inputEl) {
            let grp = inputEl.closest('.form-group');
            let list = grp.querySelector('.autocomplete-list');
            if(!list) {
                list = document.createElement('div');
                list.className = 'autocomplete-list';
                grp.appendChild(list);
            }
            
            const q = inputEl.value.toLowerCase();
            if(!q) { list.style.display = 'none'; return; }
            
            const matches = materialLibrary.filter(m => m.Name && m.Name.toLowerCase().includes(q)).slice(0, 4);
            if(matches.length > 0) {
                list.innerHTML = matches.map(m => `<div class="autocomplete-item" onclick="selectMaterial('${m.Name}', '${inputEl.id}')">${m.Name}</div>`).join('');
                list.style.display = 'block';
            } else {
                list.style.display = 'none';
            }
        }

        function selectMaterial(matName, inputId) {
            const el = document.getElementById(inputId);
            el.value = matName;
            closeLists();
            autoFillProperties(matName, inputId);
        }

        function closeLists() {
            document.querySelectorAll('.autocomplete-list').forEach(l => l.style.display = 'none');
        }

        function autoFillProperties(matName, inputId) {
            const mat = materialLibrary.find(m => m.Name === matName);
            if(!mat) return;
            
            const temp = parseFloat(document.getElementById('DesignTemp').value) || 20;
            let targetPrefix = "";
            if (inputId.includes("Shell")) targetPrefix = "Shell";
            else if (inputId.includes("Nozzle")) targetPrefix = "Nozzle";
            else if (inputId.includes("Pad")) targetPrefix = "Pad";

            const allowEl = document.getElementById(targetPrefix + "Allowable");
            const yieldEl = document.getElementById(targetPrefix + "Yield");

            if (mat.AllowableStressData) {
                let val = interpolateValue(mat.AllowableStressData, temp);
                if (allowEl && val) allowEl.value = val.toFixed(1);
            }
            if (mat.YieldStressData) {
                let val = interpolateValue(mat.YieldStressData, temp);
                if (yieldEl && val) yieldEl.value = val.toFixed(1);
            }
        }

        function interpolateValue(dataObj, targetTemp) {
            const temps = Object.keys(dataObj).map(Number).sort((a,b)=>a-b);
            if(temps.length === 0) return null;
            if(targetTemp <= temps[0]) return dataObj[temps[0]];
            if(targetTemp >= temps[temps.length-1]) return dataObj[temps[temps.length-1]];
            
            for(let i=0; i<temps.length-1; i++) {
                if(targetTemp >= temps[i] && targetTemp <= temps[i+1]) {
                    const t1 = temps[i], t2 = temps[i+1];
                    const v1 = dataObj[t1], v2 = dataObj[t2];
                    return v1 + ((targetTemp - t1) / (t2 - t1)) * (v2 - v1);
                }
            }
            return null;
        }

        function switchAnalysis(type) {
            currentAnalysis = type;
            document.getElementById('btn-shell').classList.remove('active');
            document.getElementById('btn-head').classList.remove('active');
            document.getElementById(`btn-${type}`).classList.add('active');
            document.getElementById('main_title').innerText = type === "shell" ? "Shell Nozzle Analysis" : "Vessel Head Analysis";
        }

        async function submitAnalysis() {
            const btn = document.querySelector('.btn-submit');
            btn.innerText = "Deploying...";
            btn.disabled = true;

            const payload = { AnalysisType: currentAnalysis };
            document.querySelectorAll('input:not(.hidden input), select:not(.hidden select)').forEach(el => {
                if (!el.closest('.form-group.hidden')) {
                    payload[el.name] = el.type === 'number' ? parseFloat(el.value) || 0 : el.value;
                }
            });

            try {
                const res = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "apikey": API_KEY,
                        "Authorization": `Bearer ${API_KEY}`,
                        "Prefer": "return=representation"
                    },
                    body: JSON.stringify({
                        json_payload: [payload],
                        status: "pending"
                    })
                });
                if(res.ok) {
                    const data = await res.json();
                    alert(`Deployment Successful!\nJob ID: ${data[0].id}`);
                } else {
                    alert("Submission Failed.");
                }
            } catch(e) {
                alert("Network Error.");
            }
            btn.innerText = "Deploy Analysis Model";
            btn.disabled = false;
        }

        function openSearchModal() { document.getElementById('searchModal').classList.add('active'); }
        function closeSearchModal() { document.getElementById('searchModal').classList.remove('active'); }
        
        async function searchJobs() {
            const query = document.getElementById('searchInput').value.trim();
            const results = document.getElementById('jobResults');
            if(!query) return;
            results.innerHTML = '<p>Searching...</p>';
            
            try {
                const isUUID = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(query);
                const filter = isUUID ? `id.eq.${query}` : `license_key.eq.${query}`;
                const res = await fetch(`${API_URL}?select=id,status,created_at&${filter}`, {
                    headers: { "apikey": API_KEY, "Authorization": `Bearer ${API_KEY}` }
                });
                
                if(res.ok) {
                    const data = await res.json();
                    if(data.length === 0) { results.innerHTML = '<p>No jobs found.</p>'; return; }
                    results.innerHTML = data.map(j => `<div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:10px; border:1px solid rgba(255,255,255,0.1);"><div style="font-family:monospace; color:#60a5fa;">${j.id}</div><div style="margin-top:5px; font-weight:bold; color:${j.status==='completed'?'#10b981':'#f59e0b'}">${j.status.toUpperCase()}</div></div>`).join('');
                } else {
                    results.innerHTML = '<p>Error retrieving data.</p>';
                }
            } catch(e) {
                results.innerHTML = '<p>Connection error.</p>';
            }
        }

        window.onload = buildUI;
    </script>
</body>
</html>
